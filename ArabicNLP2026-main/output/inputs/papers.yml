  title: 'DRU at WojoodNER 2024: ICL LLM for Arabic NER'
- abstract: 'Named Entity Recognition (NER) is a task in Natural Language Processing
    (NLP) that aims to identify and classify entities in text into predefined categories.

    However, when applied to Arabic data, NER encounters unique challenges stemming
    from the language''s rich morphological inflections, absence of capitalization
    cues, and spelling variants, where a single word can comprise multiple morphemes.

    In this paper, we introduce Arabic KNN-NER, our submission to the Wojood NER Shared
    Task 2024 (ArabicNLP 2024). We have participated in the shared sub-task 1 Flat
    NER. In this shared sub-task, we tackle fine-grained flat-entity recognition for
    Arabic text, where we identify a single main entity and possibly zero or multiple
    sub-entities for each word.

    Arabic KNN-NER augments the probability distribution of a fine-tuned model with
    another label probability distribution derived from performing a KNN search over
    the cached training data. Our submission achieved 91\% on the test set on the
    WojoodFine dataset, placing Arabic KNN-NER on top of the leaderboard for the shared
    task.'
