  title: 'MemeMind at ArAIEval Shared Task: Spotting Persuasive Spans in Arabic Text
    with Persuasion Techniques Identification'
- abstract: 'We present the CLTL system designed for the ArAIEval Shared Task 2024
    on multimodal propagandistic memes classification in Arabic. The challenge was
    divided into three subtasks: identifying propagandistic content from textual modality
    of memes (subtask 2A), from visual modality of memes (subtask 2B), and in a multimodal
    scenario when both modalities are combined (subtask 2C). We explored various unimodal
    transformer models for Arabic language processing (subtask 2A), visual models
    for image processing (subtask 2B), and concatenated text and image embeddings
    using the Multilayer Perceptron fusion module for multimodal propagandistic memes
    classification (subtask 2C). Our system achieved 77.96% for subtask 2A, 71.04%
    for subtask 2B, and 79.80% for subtask 2C, ranking 2nd, 1st, and 3rd on the leaderboard.'
