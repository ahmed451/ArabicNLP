  title: Arabic Automatic Story Generation with Large Language Models
- abstract: "Pre-trained Language Models \uFF08PLMs\uFF09 are integral to many modern\
    \ natural language processing \uFF08NLP\uFF09 systems. Although multilingual models\
    \ cover a wide range of languages, they often grapple with challenges like high\
    \ inference costs and a lack of diverse non-English training data. Arabic-specific\
    \ PLMs are trained predominantly on modern standard Arabic, which compromises\
    \ their performance on regional dialects. To tackle this, we construct an Arabic\
    \ dialectal corpus comprising 3.4M sentences gathered from social media platforms.\
    \ We utilize this corpus to expand the vocabulary and retrain a BERT-based model\
    \ from scratch. Named AlcLaM, our model was trained using only 13GB of text, which\
    \ represents a fraction of the data used by existing models such as CAMeL, MARBERT,\
    \ and ArBERT, compared to 7.8\\%\\%\uFF0C and 21.3\\%\uFF0C respectively. Remarkably,\
    \ AlcLaM demonstrates superior performance on a variety of Arabic NLP tasks despite\
    \ the limited training data. AlcLaM is available at: https://github.com/amurtadha/Alclam."
