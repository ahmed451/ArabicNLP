  title: 'AlexUNLP-MZ at ArAIEval Shared Task: Contrastive Learning, LLM Features
    Extraction and Multi-Objective Optimization for Arabic Multi-Modal Meme Propaganda
    Detection'
- abstract: Detecting propagandistic spans and identifying persuasion techniques are
    crucial for promoting informed decision-making, safeguarding democratic processes,
    and fostering a media environment characterized by integrity and transparency.
    Various machine learning (Logistic Regression, Random Forest, and Multinomial
    Naive Bayes), deep learning (CNN, CNN+LSTM, CNN+BiLSTM), and transformer-based
    (AraBERTv2, AraBERT-NER, CamelBERT, BERT-Base-Arabic) models were exploited to
    perform the task. The evaluation results indicate that CamelBERT achieved the
    highest micro-F1 score (24.09\%), outperforming CNN+LSTM and AraBERTv2. The study
    found that most models struggle to detect propagandistic spans when multiple spans
    are present within the same article. Overall, the model's performance secured
    a $6^{th}$ place ranking in the ArAIEval Shared Task-1.
