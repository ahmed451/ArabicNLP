- abstract: "Diacritization plays a pivotal role for meaning disambiguation and improving\
    \ readability in Arabic texts. Efforts have long focused on marking every eligible\
    \ character (Full Diacritization). Overlooked in comparison, Partial Diacritzation\
    \ (`PD`) is the selection of a subset of characters to be annotated to aid comprehension\
    \ only where needed. Research has indicated that excessive diacritic marks can\
    \ hinder skilled readers\u2014reducing reading speed and accuracy. We conduct\
    \ a behavioral experiment and show that partially marked text is often easier\
    \ to read than fully marked text, and sometimes easier than plain text. In this\
    \ light, we introduce Context-Contrastive Partial Diacritization (`CCPD`)\u2014\
    a novel approach to `PD` which integrates seamlessly with existing Arabic diacritization\
    \ systems. `CCPD` processes each word twice, once with context and once without,\
    \ and diacritizes only the characters with disparities between the two inferences.\
    \ Further, we introduce novel indicators for measuring partial diacritization\
    \ quality to help establish this as a machine learning task. Lastly, we introduce\
    \ `TD2`, a Transformer-variant of an established model which offers a markedly\
    \ different performance profile on our proposed indicators compared to all other\
    \ known systems."
