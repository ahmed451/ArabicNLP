- abstract: "Disambiguating a word\u2019s intended meaning\n(sense) in a given context\
    \ is important in Nat-\nural Language Understanding (NLU). WSD\naims to determine\
    \ the correct sense of ambigu-\nous words in context. At the same time, LMD\n\
    (a WSD variation) focuses on disambiguating\nlocation mention. Both tasks are\
    \ vital in Nat-\nural Language Processing (NLP) and informa-\ntion retrieval,\
    \ as they help correctly interpret\nand extract information from text. Arabic\
    \ ver-\nsion is further challenging because of its mor-\nphological richness,\
    \ encompassing a complex\ninterplay of roots, stems, and affixes. This pa-\nper\
    \ describes our solutions to both tasks, em-\nploying Llama3 and Cohere-based\
    \ models un-\nder Zero-Shot Learning and Re-Ranking, re-\nspectively. Both the\
    \ shared tasks were part\nof the second Arabic Natural Language Pro-\ncessing\
    \ Conference co-located with ACL 2024.\nOverall, we achieved 1st rank in the WSD\
    \ task\n(accuracy 78%) and 2nd rank in the LMD task\n(MRR@1 0.59)"
