- abstract: 'LLMs such as GPT-4 and LLaMA excel in multiple natural language processing
    tasks, however, LLMs face challenges in delivering satisfactory performance on
    low-resource languages due to limited availability of training data. In this paper,
    LLaMA-3 with 8 Billion parameters is finetuned to translate among Egyptian, Emirati,
    Jordanian, Palestinian Arabic dialects, and Modern Standard Arabic (MSA). In the
    NADI 2024 Task on DA-MSA Machine Translation, the proposed method achieved a BLEU
    score of 21.44 when it was fine-tuned on the

    development dataset of the NADI 2024 Task on DA-MSA and a BLEU score of 16.09
    when trained when it was fine-tuned using the OSACT dataset.'
