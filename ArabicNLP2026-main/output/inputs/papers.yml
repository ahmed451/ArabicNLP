- abstract: In this paper, we present our dzFinNlp team's contribution for intent
    detection in financial conversational agents, as part of the AraFinNLP shared
    task. We experimented with various models and feature configurations, including
    traditional machine learning methods like LinearSVC with TF-IDF, as well as deep
    learning models like Long Short-Term Memory (LSTM). Additionally, we explored
    the use of transformer-based models for this task. Our experiments show promising
    results, with our best model achieving a micro F1-score of 93.02% and 67.21% on
    the ArBanking77 dataset, in the development and test sets, respectively.
