- abstract: 'This paper outlines the KSAA-CAD shared task, highlighting the Contemporary
    Arabic Language Dictionary within the scenario of developing a Reverse Dictionary
    (RD) system and enhancing Word Sense Disambiguation (WSD) capabilities. The first
    KSAA-RD (Al-Matham et al., 2023) highlighted significant gaps in the domain of
    RDs, which are designed to retrieve words by their meanings or definitions. This
    shared task comprises two tasks: RD and WSD. The RD task focuses on identifying
    word embeddings that most accurately match a given definition, termed a "gloss,"
    in Arabic. Conversely, the WSD task involves determining the specific meaning
    of a word in context, particularly when the word has multiple meanings. The winning
    team achieved the highest-ranking score of 0.0644 in RD using Electra embeddings.
    In this paper, we describe the methods employed by the participating teams and
    provide insights into the future direction of KSAA-CAD.'
