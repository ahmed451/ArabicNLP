  title: Towards Zero-Shot Text-To-Speech for Arabic Dialects
- abstract: 'Speech encoders pretrained through self-supervised learning (SSL) have
    demonstrated remarkable performance in various downstream tasks, including Spoken
    Language Understanding (SLU) and Automatic Speech Recognition (ASR). For instance,
    fine-tuning SSL models for such tasks has shown significant potential, leading
    to improvements in the SOTA performance across challenging datasets.

    In contrast to existing research, this paper contributes by comparing the effectiveness
    of SSL approaches in the context of (i) the low-resource Spoken Tunisian Arabic
    Dialect and (ii) its combination with a low-resource SLU and ASR scenario, where
    only a few semantic annotations are available for fine-tuning. We conducted experiments
    using many SSL speech encoders on the TARIC-SLU dataset. We used  speech encoders
    that were pre-trained on either monolingual or multilingual speech data. Some
    of them have also been refined without in-domain nor Tunisian data through a multimodal
    supervised teacher-student learning. The study made in this paper yields numerous
    significant findings that we will discuss in the paper.'
