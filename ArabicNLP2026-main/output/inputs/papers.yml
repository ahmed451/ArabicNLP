  title: 'AraFinNLP 2024: The First Arabic Financial NLP Shared Task'
- abstract: "The recent growth in Middle Eastern stock markets has intensified the\
    \ demand for specialized financial Arabic NLP models to serve this sector. This\
    \ article presents the participation of Team SMASH of The University of Edinburgh\
    \ in the Multi-dialect Intent Detection task (Subtask 1) of the Arabic Financial\
    \ NLP (AraFinNLP) Shared Task 2024. The dataset used in the shared task is the\
    \ ArBanking77 (Jarrar et al., 2023). We tackled this task as a classification\
    \ problem and utilized several BERT and BART-based models to classify the queries\
    \ efficiently. Our solution is based on implementing a two-step hierarchical classification\
    \ model based on MARBERTv2. We fine-tuned the model by using the original queries.\
    \ Our team, SMASH, was ranked 9th with a macro F1 score of 0.7866, indicating\
    \ areas for further refinement and potential enhancement of the model\u2019s performance."
