- abstract: "News bias is difficult for humans to identify, but even more so for machines.\
    \ This is largely due to the lack of linguistically appropriate annotated datasets\
    \ suitable for use by classifier algorithms. The FIGNEWS Subtask 1: Bias Annotation\
    \ involved classifying bias through manually annotated 1800 headlines from social\
    \ media. Our proposed guidelines investigated which combinations of keywords available\
    \ for classification, across sentence and token levels, may be used to detect\
    \ possible bias in a conflict where neutrality is highly undesirable. Much of\
    \ the headlines\u2019 percentage required contextual knowledge of events to identify\
    \ criteria that matched biased or targeted language. The final annotation guidelines\
    \ paved the way for a theoretical system which uses keyword and hashtag significance\
    \ to classify major instances of bias. Minor instances with bias undertones or\
    \ clickbait may require advanced machine learning methods which learn context\
    \ through scraping user engagements on social media."
