  title: 'SMASH at AraFinNLP2024: Benchmarking Arabic BERT Models on the Intent Detection'
- abstract: In the financial industry, identifying user intent from text inputs is
    crucial for various tasks such as automated trading, sentiment analysis, and customer
    support. One important component of natural language processing (NLP) is intent
    detection, which is significant to the finance sector. Limited studies have been
    conducted in the field of finance using languages with limited resources like
    Arabic, despite notable works being done in high-resource languages like English.
    To advance Arabic NLP in the financial domain, the organizer of AraFinNLP 2024
    has arranged a shared task for detecting banking intents from the queries in various
    Arabic dialects, introducing a novel dataset named ArBanking77 which includes
    a collection of banking queries categorized into 77 distinct intents classes.
    To accomplish this task, we have presented a hierarchical approach called Dual-Phase-BERT
    in which the detection of dialects is carried out first, followed by the detection
    of banking intents. Using the provided ArBanking77 dataset, we have trained and
    evaluated several conventional machine learning, and deep learning models along
    with some cutting-edge transformer-based models. Among these models, our proposed
    Dual-Phase-BERT model has ranked $7^{th}$ out of all competitors, scoring 0.801
    on the scale of F1-score on the test set.
