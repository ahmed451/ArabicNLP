- abstract: "Relational entity extraction is key in building knowledge graphs. A relational\
    \ entity has a source, a tail and atype. \nIn this paper, we consider Arabic text\
    \ and introduce evidence enrichment which intuitively\ninforms models for better\
    \ predictions. \nRelational evidence is an expression in the text\nthat explains\
    \ how sources and targets relate. \n%It also provides hints from which models\
    \ learn. \nThis paper augments the existing \\sred relational extraction dataset\
    \ with evidence annotation to its \n$2.9$-million Arabic relations.\nWe leverage\
    \ the augmented dataset to build \\model, a relation extraction with evidence\
    \ model \nfrom Arabic documents. \nThe evidence augmentation model we constructed\
    \ to complete the dataset \nachieved $.82$ F1-score (.93 precision, .73 recall).\
    \ \nThe target \\model outperformed SOTA mREBEL with $.72$ F1-score (.78 precision,\
    \ .66 recall)."
