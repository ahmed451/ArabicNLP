- abstract: "The rapid advancements in Large Language Models (LLMs) have led to significant\
    \ improvements in various natural language processing tasks. However, the evaluation\
    \ of LLMs\u2019 legal knowledge, particularly in non English languages such as\
    \ Arabic, remains under-explored. To address this gap, we introduce ArabLegalEval,\
    \ a multitask benchmark dataset for assessing the Arabic legal knowledge of LLMs.\
    \ Inspired by the MMLU and LegalBench datasets, ArabLegalEval consists of multiple\
    \ tasks sourced from Saudi legal documents and synthesized questions. In this\
    \ work, we aim to analyze the capabilities required to solve legal problems in\
    \ Arabic and benchmark the performance of state-of-the-art LLMs. We explore the\
    \ impact of in-context learning on performance and investigate various evaluation\
    \ methods. Additionally, we explore workflows for automatically generating questions\
    \ with automatic validation to enhance the dataset\u2019s quality. By releasing\
    \ ArabLegalEval and our code, we hope to accelerate AI research in the Arabic\
    \ Legal domain"
