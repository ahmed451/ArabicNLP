  title: 'AlexuNLP24 at AraFinNLP2024: Multi-Dialect Arabic Intent Detection with
    Contrastive Learning in Banking Domain'
- abstract: Intention detection is a crucial aspect of natural language understanding
    (NLU), focusing on identifying the primary objective underlying user input. In
    this work, we present a transformer-based method that excels in determining the
    intent of Arabic text within the banking domain. We explored several machine learning
    (ML), deep learning (DL), and transformer-based models on an Arabic banking dataset
    for intent detection. Our findings underscore the challenges that traditional
    ML and DL models face in understanding the nuances of various Arabic dialects,
    leading to subpar performance in intent detection. However, the transformer-based
    methods, designed to tackle such complexities, significantly outperformed the
    other models in classifying intent across different Arabic dialects. Notably,
    the AraBERTv2 model achieved the highest micro F1 score of 82.08\% in ArBanking77
    dataset, a testament to its effectiveness in this context. This achievement, which
    contributed to our work being ranked 5$^{th}$ in the shared task, AraFinNLP2024,
    highlights the importance of developing models that can effectively handle the
    intricacies of Arabic language processing and intent detection.
