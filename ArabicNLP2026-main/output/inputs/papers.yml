- abstract: This paper details our participation in the FIGNEWS-2024 shared task on
    bias and propaganda annotation in Gaza conflict news. Our objectives were to develop
    robust guidelines and annotate a substantial dataset to enhance bias detection.
    We iteratively refined our guidelines and used examples for clarity.  Key findings
    include the challenges in achieving high inter-annotator agreement and the importance
    of annotator awareness of their own biases. We also explored the integration of
    ChatGPT as an annotator to support consistency. This paper contributes to the
    field by providing detailed annotation guidelines, and offering insights into
    the subjectivity of bias annotation.
