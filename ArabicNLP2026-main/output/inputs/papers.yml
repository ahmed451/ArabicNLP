  title: 'ASOS at ArAIEval Shared Task: Integrating Text and Image Embeddings for
    Multimodal Propaganda Detection in Arabic Memes'
- abstract: This paper presents our system submitted for Task 1 of the ArAIEval Shared
    Task on Unimodal (Text) Propagandistic Technique Detection in Arabic. Task 1 involves
    identifying all employed propaganda techniques in a given text from a set of possible
    techniques or detecting that no propaganda technique is present. Additionally,
    the task requires identifying the specific spans of text where these techniques
    occur. We explored the capabilities of a multilingual BERT model for this task,
    focusing on the effectiveness of using outputs from different hidden layers within
    the model. By fine-tuning the multilingual BERT, we aimed to improve the model's
    ability to recognize and locate various propaganda techniques. Our experiments
    showed that leveraging the hidden layers of the BERT model enhanced detection
    performance. Our system achieved competitive results, ranking second in the shared
    task, demonstrating that multilingual BERT models, combined with outputs from
    hidden layers, can effectively detect and identify spans of propaganda techniques
    in Arabic text.
