  title: Investigating Linguistic Features for Arabic NLI
- abstract: Large language models (LLMs) play a crucial role in a wide range of real
    world applications. However, concerns about their safety and ethical implications
    are growing. While research on LLM safety is expanding, there is a noticeable
    gap in evaluating safety across multiple languages, especially in Arabic and Russian.
    We address this gap by exploring biases in LLMs across different languages and
    contexts, focusing on GPT-3.5 and Gemini. Through carefully designed argument-based
    prompts and scenarios in Arabic, English, and Russian, we examine biases in cultural,
    political, racial, religious, and gender domains. Our findings reveal biases in
    these domains. In particular, our investigation uncovers subtle biases where each
    model tends to present winners as those speaking the primary language the model
    is prompted with. Our study contributes to ongoing efforts to ensure justice and
    equality in LLM development and emphasizes the importance of further research
    towards responsible progress in this field.
