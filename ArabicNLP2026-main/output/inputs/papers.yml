  title: 'JusticeLeague at FIGNEWS 2024 Shared Task: Innovations in Bias Annotation'
- abstract: This research paper presents an in-depth examination of bias identification
    in media content related to the Israel-Palestine war. Focusing on the annotation
    guidelines and process developed by our team of researchers, the document outlines
    a systematic approach to discerning bias in articles. Through meticulous analysis,
    key indicators of bias such as emotive language, weasel words, and loaded comparisons
    are identified and discussed. The paper also explores the delineation between
    facts and opinions, emphasizing the importance of maintaining objectivity in annotation.
    Ethical considerations, including the handling of sensitive data and the promotion
    of multipartiality among annotators, are carefully addressed. The annotation guidelines
    also include other ethical considerations such as identifying rumors, false information,
    exercising prudence and selective quotations. The research paper offers insights
    into the annotation experience, highlighting common mistakes and providing valuable
    guidelines for future research in bias identification. By providing a comprehensive
    framework for evaluating bias in media coverage of the Israel-Palestine war, this
    study contributes to a deeper understanding of the complexities inherent in media
    discourse surrounding contentious geopolitical issues.
