- abstract: 'This paper presents an overview of the Arabic Natural Language Understanding
    (ArabicNLU 2024) shared task, focusing on two subtasks: Word Sense Disambiguation
    (WSD) and Location Mention Disambiguation (LMD). The task aimed to evaluate the
    ability of automated systems to resolve word ambiguity and identify locations
    mentioned in Arabic text. We provided participants with novel datasets, including
    a sense-annotated corpus for WSD, called SALMA with approximately $34$k annotated
    tokens, and the \idda{} dataset with $3,893$ annotations and $763$ unique location
    mentions. These are challenging tasks. Out of the $38$ registered teams, only
    three teams participated in the final evaluation phase, with the highest accuracy
    being $77.8\%$ for WSD and $95.0\%$ for LMD. The shared task not only facilitated
    the evaluation and comparison of different techniques, but also provided valuable
    insights and resources for the continued advancement of Arabic NLU technologies.'
