  title: 'KSAA-CAD Shared Task:  Contemporary Arabic Dictionary  for Reverse Dictionary
    and Word Sense Disambiguation'
- abstract: We present Team Cher's submission to the ArabicNLP 2024 KSAA-CAD shared
    task on the reverse dictionary for Arabic---the retrieval of words using definitions
    as a query. Our approach is based on a multi-task learning framework that jointly
    learns reverse dictionary, definition generation, and reconstruction tasks. This
    work explores different tokenization strategies and compares retrieval performance
    for each embedding architecture. Evaluation using the KSAA-CAD benchmark demonstrates
    the effectiveness of our multi-task approach and provides insights into the reverse
    dictionary task for Arabic. It is worth highlighting that we achieve strong performance
    without using any external resources in addition to the provided training data.
