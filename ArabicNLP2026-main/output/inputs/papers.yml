  title: 'WojoodNER 2024: The Second Arabic Named Entity Recognition Shared Task'
- abstract: "This paper presents our system ``muNERa'', submitted to the WojoodNER\
    \ 2024 shared task at the second ArabicNLP conference. We participated in two\
    \ subtasks, the flat and nested fine-grained NER sub-tasks (1 and 2). muNERa achieved\
    \ first place in the nested NER sub-task and second place in the flat NER sub-task.\
    \ The system is based on the TANL framework \\cite{paolini2021structured},\nby\
    \ using a sequence-to-sequence structured language translation approach to model\
    \ both tasks.\n We utilize the pre-trained AraT5\\textsubscript{v2}-base model\
    \ as the base model for the TANL framework. The best-performing muNERa model achieves\
    \ 91.07\\% and 90.26\\% for the F-1 scores on the test sets for the nested and\
    \ flat subtasks, respectively."
