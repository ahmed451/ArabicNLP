  title: 'ArAIEval Shared Task: Propagandistic Techniques Detection in Unimodal and
    Multimodal Arabic Content'
- abstract: Detecting propaganda in multimodal content, such as memes, is crucial
    for combating disinformation on social media. This paper presents a novel approach
    for the ArAIEval 2024 shared Task 2 on Multimodal Propagandistic Memes Classification,
    involving text, image, and multimodal classification of Arabic memes. For text
    classification (Task 2A), we fine-tune state-of-the-art Arabic language models
    and use ChatGPT4-generated synthetic text for data augmentation. For image classification
    (Task 2B), we fine-tune ResNet18, EfficientFormerV2, and ConvNeXt-tiny architectures
    with DALL-E-2-generated synthetic images. For multimodal classification (Task
    2C), we combine ConvNeXt-tiny and BERT architectures in a fusion layer to enhance
    binary classification. Our results show significant performance improvements with
    data augmentation for text and image classification models and with the fusion
    layer for multimodal classification. We highlight challenges and opportunities
    for future research in multimodal propaganda detection in Arabic content, emphasizing
    the need for robust and adaptable models to combat disinformation.
