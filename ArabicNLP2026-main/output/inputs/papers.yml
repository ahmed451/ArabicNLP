  title: 'AlclaM: Arabic Dialect Language Model'
- abstract: This paper describes a data augmentation technique for boosting the performance
    of speech-based diacritic restoration. Our experiments demonstrate the utility
    of this appraoch, resulting in improved generalization of all models across different
    test sets. In addition, we describe the first multi-modal diacritic restoration
    model, utilizing both speech and text as input modalities. This type of model
    can be used to diacritize speech transcripts. Unlike previous work that relies
    on an external ASR model, the proposed model is far more compact and efficient.
    While the multi-modal framework does not surpass the ASR-based model for this
    task, it offers a promising approach for improving the efficiency of speech-based
    diacritization, with a potential for improvement using data augmentation and other
    methods.
