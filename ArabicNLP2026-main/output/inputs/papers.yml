- abstract: We describe our submitted system to the 2024 Shared Task on The Arabic
    Financial NLP (Malaysha et al., 2024). We tackled Subtask 1, namely Multi-dialect
    Intent Detection. We used state-of-the-art pretrained contextualized text representation
    models and fine-tuned them according to the downstream task at hand. We started
    by finetuning multilingual BERT and various Arabic variants, namely MARBERTV1,
    MARBERTV2, and CAMeLBERT. Then, we employed an ensembling technique to improve
    our classification performance combining MARBERTV2 and CAMeLBERT embeddings. The
    findings indicate that MARBERTV2 surpassed all the other models mentioned.
