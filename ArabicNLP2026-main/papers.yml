- abstract: Quranic Arabic poses important challenges for Arabic NLP due to its distinctive
    morphology, syntax, and orthography. We present MAQAM, a richly annotated Morphosyntactic
    Arabic Quranic Analysis and Modeling resource covering the entire Quran, providing
    22 lexical, inflectional, and clitic features for every word. The resource is
    constructed through a semi-automatic pipeline combining feature enrichment, morphological
    synchronization, and expert manual annotation and validation. We further evaluate
    Quranic morphosyntactic disambiguation under a realistic setting where the input
    may be represented in either the Uthmani or Imla’i script, and investigate cross-domain
    transfer between Quranic Arabic and MSA. Our results show that MSA and Quranic
    resources are complementary for Quranic disambiguation, with the best performance
    obtained by combining MSA training data, Quran-specific analyzers, and both script
    representations, whereas for MSA, only integrating Quranic resources provide modest
    gains. We make MAQAM publicly available.
