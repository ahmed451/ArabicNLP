  title: 'SALM: Social Arabic Language Model'
- abstract: "This paper addresses automatic readability assessment of Arabic documents.\
    \ \nIt compares classical readability formulae, fine-tuned Arabic encoders, zero-shot\
    \ large language models and a Co-occurrence Graphs for Arabic Readability (CoGAR).\
    \ CoGAR, interpretable and LLM-free, represents a document as a co-occurrence\
    \ network over content lemmas and use topology features such as density, clustering,\
    \ path length and degree entropy to predict readability. Evaluated on the BAREC\
    \ corpus over five ordinal levels, the method reaches a quadratic weighted kappa\
    \ (QWK) of 0.756, on par with a sparse 35B-parameter LLM and well above the surface\
    \ formulas Flesch and OSMAN.\n\nAn ablation shows that the signal lies in the\
    \ graph's shape rather than size, and that alternative graphs based on relations\
    \ between named-entity carry almost no readability difficulty signal. \nWe further\
    \ distill a frontier LLM (Gemini) into a small Arabic encoder (NeoAraBERT) \n\
    by silver labelling 30k chunks, reaching 0.714 QWK. \nWe show that stacking an\
    \ LLM with CoGAR improves on the LLM alone, reaching QWK 0.839 with GPT-4.1 and\
    \ 0.852 with the open-weight Qwen-35B, our best result. \nThe two signals are\
    \ complementary and the gain does not depend on a proprietary model.\nFinally,\
    \ we analyze how\neight methods including CoGAR distribute reading levels across\
    \ seven Arabic text sources ranging from children \nbooks to expert research manuscripts\
    \ showing how the methods align with intuitive difficulty."
