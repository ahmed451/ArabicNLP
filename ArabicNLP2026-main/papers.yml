  title: 'AraMIP: Extending MIPVU Towards Metaphor Identification in Arabic'
- abstract: Academic paraphrasing in Modern Standard Arabic must change expression
    without distorting scientific content. We study this balance through AraScholar,
    a corpus of 20,002 manually written source--paraphrase pairs with 522 raw domain
    labels and item-level provenance. On 2,000 held-out sentences, fine-tuned AraT5v2
    favors lexical reuse under beam search, while frontier models produce more extensive
    rewrites. With corrected Arabic punctuation normalization, diverse decoding and
    preservation-constrained reranking attain 74.25\% coverage of a fixed novelty--preservation
    band, compared with 52.60\% for zero-shot GPT-4o. Gold coverage is only 46.65\%,
    showing that this band measures constraint compliance rather than human quality.
    Post-hoc target matching substantially improves a calibrated GPT-4o control and
    narrows the gap, although candidate budgets differ. Crucially, an independent
    200-instance audit favors frontier models on meaning and paraphrase quality. We
    document the corpus, decoding controls, negative distillation result, and metric
    sensitivity, including test-derived calibration and checkpoint-selection limitations.
    The findings establish operating-point control as a useful capability while demonstrating
    why calibration must be evaluated alongside independent assessments of writing
    quality.
