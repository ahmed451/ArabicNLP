- abstract: Relevance is a central component of Automated Essay Scoring (AES), as
    it measures how well a student essay addresses a given writing prompt. In this
    work, we propose AESER, a novel approach to address the problem of graded relevance
    scoring in Arabic cross-prompt AES. AESER adapts the given prompt more towards
    the writing space of essays and computes token-level prompt-essay similarity matrices
    from contextual embeddings. These matrices are processed by a convolutional neural
    network to predict the relevance score. Experiments on a large Arabic AES dataset
    show that AESER outperforms strong baselines, establishing a new state-of-the-art
    performance.
