  title: 'SAFIR: A Sub-Dialectal Benchmark for Saudi Arabic–English Machine Translation'
- abstract: 'We introduce QuranicMMLU, a benchmark for evaluating generative AI on
    Quranic Arabic across multiple dimensions of linguistic complexity. Existing Quranic
    benchmarks center on general question answering and semantic retrieval, without
    probing specific linguistic competencies or stratifying by cognitive demand and
    verse difficulty. We construct a five-pillar Quranic taxonomy spanning Phonology,
    Morphology, Syntax, Semantics, and Pragmatics, with 31 leaves covering phenomena
    from tajwid and root-and-pattern morphology to occasions of revelation and inter-surah
    coherence. For each leaf we generate questions stratified by Bloom’s cognitive
    level and verse perplexity, then have LLM as a judge to independently answer and
    score every item and route the annotations to manual review. The resulting dataset
    comprises 980 human reviewed questions, each issued in both open ended and multiple-choice
    form. We benchmark 12 systems on these items and find that the Islamic-specialized
    model leads, yet every system scores higher on multiple-choice accuracy (average
    84%) than open-ended answer quality (average 60%): the two rankings agree closely
    (Kendall’s τ = 0.73), but multiple-choice scoring hides failures that surface
    only once answer choices are removed. QuranicMMLU thus offers a rigorous, linguistically
    grounded framework for evaluating Arabic NLP in the Quranic domain.'
