- abstract: 'We present BAREC-TB, the first dependency treebank of Arabic children’s
    literature and educational texts.

    The 156K-word corpus includes texts drawn from eight sources, including curricula,
    reading materials, children’s stories, poems, and songs.

    The treebank is annotated according to the Columbia Arabic Treebank (CATiB) dependency
    representation.

    We compare BAREC-TB with existing Arabic treebanks, including the Penn Arabic
    Treebank and Camel Treebank, using corpus statistics, dependency-based measures
    of syntactic complexity, readability and vocabulary-related features.

    We also establish parsing benchmarks using both a trainable parser and large language
    models.

    The corpus will be made publicly available to support Arabic NLP, educational
    NLP, and language pedagogy research: https://barec.camel-lab.com/.'
