- abstract: We introduce Definition-Guided Learning (DGL), a contrastive training
    framework that uses dictionary definitions as semantic queries and lemmas as retrieval
    targets, instantiated here for Arabic reverse dictionary retrieval. We construct
    a root-stratified Arabic lexical benchmark that limits morphological root overlap
    between training and test partitions. Zero-shot evaluation suggests a notable
    gap, with the best pre-trained model achieving only 11.16\% Top@1 accuracy on
    this benchmark. Fine-tuning with DGL yields 41.13\% Top@1 and NDCG@10 of 49.32\%,
    an improvement of roughly 3.7 times over the strongest zero-shot baseline we tested.
    Our results suggest that in-batch negative sampling tends to outperform Triplet
    Loss in this setting, and that definition length and lexical difficulty appear
    to trade off in importance across retrieval depth. These findings offer preliminary
    evidence that lexicographic resources can serve as a useful supervisory signal
    for Arabic embedding learning, at least within the scope of the benchmark studied
    here.
