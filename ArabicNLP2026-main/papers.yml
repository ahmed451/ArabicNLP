- abstract: 'Metaphor research has gained increasing attention due to its relevance
    to linguistic creativity, language use, cognitive processes, and related areas.
    While many efforts have been devoted to metaphor identification and annotation
    in English and other languages, Arabic remains under-resourced in this area. In
    this work, we propose the Arabic Metaphor Identification Procedure (AraMIP), a
    novel guideline for Arabic metaphor annotation. AraMIP builds on the widely used
    Metaphor Identification Procedure Vrije Universiteit (MIPVU) framework, incorporating
    adaptations that account for the language-specific properties of Arabic. We distinguish
    three major types of Arabic figurative language: isti‘āra (metaphor), kināya (metonymy/indirect
    expression), and tashbīh (simile) and annotate a pilot dataset of 300 sentences
    (5277 words). Our analysis reveals key challenges specific to Arabic, including
    morphological complexity, inconsistencies in dictionary sense ordering, and the
    absence of standardized contextual materials for annotators. This work contributes
    a first step toward standardized Arabic figurative instances and facilitates the
    development of larger annotated resources, thereby supporting future research
    on figurative language in Arabic.'
