  title: 'What WER Hides: A Closer Look at Algerian Code-Switched ASR'
- abstract: Hateful memes are a growing form of multimodal online harm, where hostile
    intent is often conveyed through the joint interpretation of images, text, cultural
    references, and implicit targets. While hateful meme detection has advanced in
    high-resource languages, Arabic remains underexplored, with existing meme resources
    focusing mainly on propaganda or coarse harmful-content labels. We introduce AHA-Memes,
    which is, to our knowledge, the first large Arabic hateful meme benchmark with
    fine-grained, multi-label annotations. The dataset includes 5K manually annotated
    memes using a taxonomy that captures hate types, i.e., attack strategies. We further
    provide ~66K silver-labeled memes to support future studies. We benchmark text-only,
    image-only, and late-fusion multimodal models, as well as few-shot in-context
    learning (ICL) and open- and closed-weight Vision-Language Models (VLMs) under
    zero-shot and fine-tuning settings. Our results establish strong baselines and
    highlight key challenges in culturally grounded Arabic hateful meme detection.
    We release the dataset, annotation guidelines, and evaluation scripts to support
    future research. (**Resources:** https://github.com/MohamedBayan/AHA-Memes) (**Hugging
    Face:** https://huggingface.co/datasets/QCRI/AHA-MEMES)
