  title: 'Tool Calling for Arabic LLMs: Data Strategies and Instruction Tuning'
- abstract: Despite the growing importance of online discourse, Arabic-speaking communities
    lack platforms that support structured, culturally grounded debate. Mainstream
    social media rarely fosters constructive engagement, often leading to polarization
    and superficial exchanges. This paper proposes the development of a culturally
    aware debate platform tailored to the values and traditions of Arabic-speaking
    users, with a focus on leveraging advances in natural language processing (NLP).
    We present findings from a user survey that explores experiences with existing
    debate tools and expectations for future platforms. Besides, we analyze 30,000
    English-language debate topics using large language models (LLMs) to assess their
    cultural relevance and appropriateness for Arab audiences. We further examine
    the ability of LLMs to generate new culturally resonant debate topics, contributing
    to the emerging tasks of culture-aware topic assessment and generation. Finally,
    we propose a theoretical and technical framework for building an NLP-supported
    Arabic debate platform. Our work highlights the urgent need for culturally sensitive
    NLP resources that foster critical thinking, digital literacy, and meaningful
    deliberation in Arabic.
