- abstract: Under-represented languages suffer from a lack of data, and as a result,
    there are few LLMs that support them. Extending an existing LLM to a new language
    is a practical option for startups, university labs, and organizations with limited
    budgets. This process involves several steps. In this paper, we describe how we
    adapted the Falcon3-7B model to Arabic, covering everything from data collection
    and training to evaluation. Falcon-Arabic was trained exclusively on native data
    to better capture the cultural and linguistic aspects of the language. Our evaluations
    show that Falcon-Arabic achieves state-of-the-art results on a range of Arabic
    benchmarks.
