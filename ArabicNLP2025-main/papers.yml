- abstract: "This paper evaluates the knowledge and reasoning capabilities of Large\
    \ Language Models  in Islamic inheritance law, ʿilm al-mawārīth. We assess the\
    \  performance of seven LLMs using a  benchmark of 1,000 multiple-choice questions\
    \ covering  diverse inheritance scenarios, designed to test each model's ability—from\
    \ understanding the inheritance context to computing the distribution of shares\
    \ prescribed  by Islamic jurisprudence. \nThe results show a wide performance\
    \ gap among models. o3 and Gemini 2.5 achieved accuracies above 90%, while ALLaM,\
    \ Fanar, LLaMA, and Mistral scored below 50%. These disparities reflect important\
    \ differences in reasoning ability and domain adaptation.\nWe conduct a detailed\
    \ error analysis to identify recurring failure patterns across models, including\
    \ misunderstandings of inheritance scenarios, incorrect application of legal rules,\
    \ and insufficient domain knowledge. Our findings highlight the limitations of\
    \ current models in handling structured legal reasoning and suggest directions\
    \ for improving their performance in Islamic legal reasoning."
