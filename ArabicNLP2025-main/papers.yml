  title: 'Nile-Chat: Egyptian Language Models for Arabic and Latin Scripts'
- abstract: 'Post-training has emerged as a crucial technique for aligning pre-trained
    Large Language Models (LLMs) with human instructions, significantly enhancing
    their performance across a wide range of tasks. Central to this process is the
    quality and diversity of post-training datasets. This paper presents a review
    of publicly available Arabic post-training datasets on the Hugging Face Hub, organized
    along four key dimensions: (1) LLM Capabilities (e.g., Question Answering, Translation,
    Reasoning, Summarization, Dialogue, Code Generation, and Function Calling); (2)
    Steerability (e.g., Persona and System Prompts); (3) Alignment (e.g., Cultural,
    Safety, Ethics, and Fairness); and (4) Robustness. Each dataset is rigorously
    evaluated based on popularity, practical adoption, recency and maintenance, documentation
    and annotation quality, licensing transparency, and scientific contribution. Our
    review revealed critical gaps in the development of Arabic post-training datasets,
    including limited task diversity, inconsistent or missing documentation and annotation,
    and low adoption across the community. Finally, the paper discusses the implications
    of these gaps on the progress of Arabic-centric LLMs and applications while providing
    concrete recommendations for future efforts in Arabic post-training dataset development.'
