  title: 'TEDxTN: A Three-way Speech Translation Corpus for Code-Switched Tunisian
    Arabic - English'
- abstract: Video-to-text and text-to-video retrieval are dominated by English benchmarks
    (e.g. DiDeMo, MSR-VTT) and recent multilingual corpora (e.g. RUDDER), yet Arabic
    remains underserved, lacking localized evaluation metrics. We introduce a three-stage
    framework, AutoArabic, utilizing state-of-the-art large language models (LLMs)
    to translate non-Arabic benchmarks into Modern Standard Arabic, reducing the manual
    revision required by nearly fourfold. The framework incorporates an error detection
    module that automatically flags potential translation errors with 97\% accuracy.
    Applying the framework to DiDeMo, a video retrieval benchmark produces DiDeMo-AR,
    an Arabic variant with 40,144 fluent Arabic descriptions. An analysis of the translation
    errors is provided and organized into an insightful taxonomy to guide future Arabic
    localization efforts. We train a CLIP-style baseline with identical hyperparameters
    on the Arabic and English variants of the benchmark, finding a moderate performance
    gap ($\Delta \approx 3$\,pp at Recall@1), indicating that Arabic localization
    preserves benchmark difficulty. We evaluate three post-editing budgets (zero/
    flagged-only/ full) and find that performance improves monotonically with more
    post-editing, while the raw LLM output (zero-budget) remains usable. To ensure
    reproducibility to other languages, we made the code available at https://github.com/Tahaalshatiri/AutoArabic.
