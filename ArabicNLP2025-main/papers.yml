  title: 'ALARB: An Arabic Legal Argument Reasoning Benchmark'
- abstract: 'Argument mining for Arabic remains underexplored, largely due to the
    scarcity of annotated corpora. To address this gap, we examine the effectiveness
    of cross-lingual transfer from English. Using the English Persuasive Essays (PE)
    corpus, annotated with argumentative components (Major Claim, Claim, and Premise),
    we explore several transfer strategies: training encoder-based multilingual and
    monolingual models on English data, machine-translated Arabic data, and their
    combination. We further assess the impact of annotation noise introduced during
    translation by manually correcting portions of the projected training data. In
    addition, we investigate the potential of prompting large language models (LLMs)
    for the task. Experiments on a manually corrected Arabic test set show that monolingual
    models trained on translated data achieve the strongest performance, with further
    improvements from small-scale manual correction of training examples.'
