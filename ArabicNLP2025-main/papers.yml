  title: 'BALSAM: A Platform for Benchmarking Arabic Large Language Models'
- abstract: 'In this paper, we introduce TEDxTN, the first publicly available Tunisian
    Arabic to English speech translation dataset. This work is in line with the ongoing
    effort to mitigate the data scarcity obstacle for a number of Arabic dialects.
    We collected, segmented, transcribed and translated 108 TEDx talks following our
    internally developed annotations guidelines. The. collected talks represent 25
    hours of speech
    with code-switching that cover speakers with various accents from over 11 different
    regions of Tunisia. We make the annotation guidelines
    and corpus publicly available. This will enable the extension of TEDxTN to new
    talks as they become available. We also report results
    for strong baseline systems of Speech Recognition and Speech Translation using
    multiple pre-trained and fine-tuned end-to-end models.
    This corpus is the first open source and publicly available speech translation
    corpus of Code-Switching Tunisian dialect. We believe that
    this is a valuable resource that can motivate and facilitate further research
    studying Tunisian Dialect.'
