- abstract: Arabic is one of the most widely spoken languages in the world, yet efforts
    to develop and evaluate Large Language Models (LLMs) for Arabic remain relatively
    limited. Most existing Arabic benchmarks focus on linguistic, cultural, or religious
    content, leaving a significant gap in areas like STEM and coding domains that
    are increasingly relevant for real-world LLM applications. To help bridge this
    gap, we present \textbf{3LM}, a suite of \textbf{three} benchmarks designed specifically
    for Arabic. The first is a set of STEM-related question-answer pairs, naturally
    sourced from Arabic textbooks and educational worksheets. The second consists
    of synthetically generated STEM questions, created using the same sources. The
    third benchmark focuses on code generation, built through a careful translation
    of two widely used code benchmarks, incorporating a human-in-the-loop process
    with several rounds of review to ensure high-quality and faithful translations.
    We release all three benchmarks publicly to support the growth of Arabic LLM research
    in these essential but underrepresented areas\footnote{3LM benchmark is accessible
    on \url{https://github.com/tiiuae/3LM-benchmark}}.
