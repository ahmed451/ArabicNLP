- abstract: 'Grapheme-to-phoneme (G2P) models are essential components in text-to-speech  (TTS)
    and pronunciation assessment applications. While standard forms of languages have
    gained attention in that regard, dialectal speech, which often serves as the primary
    means of spoken communication for many communities, as it is the case for Arabic,
    has not received the same level of focus. In this paper, we introduce  an
    end-to-end dialectal G2P for Egyptian Arabic, a dialect without standard orthography.
    Our novel architecture accomplishes three tasks: (i) restores short vowels of
    the diacritical marks for the dialectal text; (ii) maps certain characters that
    happen only in the spoken version of the dialectal Arabic to their dialect-specific
    character transcriptions; and finally (iii) converts the previous step output  to
    the corresponding phoneme sequence. We benchmark G2P on a modular cascaded system,
    a large language model, and our multi-task end-to-end architecture.'
