- abstract: Lemmatization for dialectal Arabic poses many challenges due to the lack
    of orthographic standards and limited morphological analyzers. This work explores
    the effectiveness of Seq2Seq models for lemmatizing dialectal Arabic, both without
    analyzers and with their integration. We assess how well these models generalize
    across dialects and benefit from related varieties. Focusing on Egyptian, Gulf,
    and Levantine dialects with varying resource levels, our analysis highlights both
    the potential and limitations of data-driven approaches. The proposed method achieves
    significant gains over baselines, performing well in both low-resource and dialect-rich
    scenarios.
