- id: 146
  file: 146.pdf
  abstract: 'We present the findings of the first shared task on Qur’anic pronunciation
    assessment, which focuses on addressing the unique challenges of evaluating the
    precise pronunciation of Qur’anic recitation. To fill an existing research gap,
    the Iqra’Eval 2025 shared task introduces the first open benchmark for Mispronunciation
    Detection and Diagnosis (MDD) in Qur’anic recitation, using Modern Standard Arabic
    (MSA) reading of Qur’anic texts as its case study. The task provides a comprehensive
    evaluation framework with increasingly complex subtasks: error localization and
    detailed error diagnosis. Leveraging the recently developed QuranMB benchmark
    dataset along with auxiliary training resources, this shared task aims to stimulate
    research in an area of both linguistic and cultural significance while addressing
    computational challenges in pronunciation assessment.'
