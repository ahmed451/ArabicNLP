- id: 143
  file: 143.pdf
  abstract: 'This paper presents the MAHED 2025 Shared Task on Multimodal Detection
    of Hope and Hate Emotions in Arabic Content, comprising three subtasks: (1) text-based
    classification of Arabic content into hate and hope, (2) multi-task learning for
    joint prediction of emotions, offensive content, and hate speech, and (3) multimodal
    detection of hateful content in Arabic memes. We provide three high-quality datasets
    totaling over 22,000 instances sourced from social media platforms, annotated
    by native Arabic speakers with Cohen’s Kappa exceeding 0.85. Our evaluation attracted
    46 leaderboard submissions from participants, with systems leveraging Arabic-specific
    pre-trained language models (AraBERT, MARBERT), large language models (GPT-4,
    Gemini), and multimodal fusion architectures combining CLIP vision encoders with
    Arabic text models. The best-performing systems achieved macro F1-scores of 0.723
    (Task 1), 0.578 (Task 2), and 0.796 (Task 3), with top teams employing ensemble
    methods, class-weighted training, and OCR-aware multimodal fusion. Analysis reveals
    persistent challenges in dialectal robustness, minority class detection for hope
    speech, and highlights key directions for future Arabic content moderation research.'
