- id: 139
  file: 139.pdf
  abstract: 'This paper provides a comprehensive overview of the QIAS 2025 shared
    task, organized as part of the ArabicNLP 2025 conference and co-located with EMNLP
    2025. The task was designed for the evaluation of large language models in the
    complex domains of religious and legal reasoning. It comprises two subtasks: (1)
    Islamic Inheritance Reasoning, requiring models to compute inheritance shares
    according to Islamic jurisprudence, and (2) Islamic Knowledge Assessment, which
    covers a range of traditional Islamic disciplines. Both subtasks were structured
    as multiple-choice question answering  challenges, with questions stratified by
    varying difficulty levels. The shared task attracted significant interest, with
    44 teams participating in the development phase, from which 18 teams advanced
    to the final test phase. Of these, $6$ teams submitted entries for both subtasks,
    $8$ for Task 1 only, and two for Task $3$ only. Ultimately, $16$ teams submitted
    system description papers. Herein, we detail the task''s motivation, dataset construction,
    evaluation protocol, and present a summary of the participating systems and their
    results.'
