- id: 138
  file: 138.pdf
  abstract: 'We present the results and findings of the BAREC Shared Task 2025 on
    Arabic Readability Assessment, organized as part of The Third Arabic Natural Language
    Processing Conference (ArabicNLP 2025). The BAREC 2025 shared task focuses on
    automatic readability assessment using BAREC Corpus, addressing fine-grained classification
    into 19 readability levels. The shared task includes two sub-tasks: sentence-level
    classification and document-level classification, and three tracks: (1) Strict
    Track, where only BAREC Corpus is allowed; (2) Constrained Track, restricted to
    the BAREC Corpus, SAMER Corpus, and SAMER Lexicon, and (3) Open Track, allowing
    any external resources. A total of 22 teams from 12 countries registered for the
    task. Among these, 17 teams submitted system description papers. The winning team
    achieved 87.5 QWK on the sentence-level task and 87.4 QWK on the document-level
    task.'
