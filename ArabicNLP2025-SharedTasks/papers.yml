- id: 140
  file: 140.pdf
  abstract: 'Automated Essay Scoring (AES) has emerged as a significant research problem
    in natural language processing, offering valuable tools to support educators in
    assessing student writing. Motivated by the growing need for reliable Arabic AES
    systems, we organized the first shared Task for Arabic Quality Evaluation of Essays
    in Multi-dimensions (TAQEEM) held at the ArabicNLP 2025 conference. TAQEEM 2025
    includes two subtasks: Task A on holistic scoring and Task B on trait-specific
    scoring. It introduces a new (and first of its kind) dataset of 1,265 Arabic essays,
    annotated with holistic and trait-specific scores, including relevance, organization,
    vocabulary, style, development, mechanics, and grammar. The main goal of TAQEEM
    is to address the scarcity of standardized benchmarks and high-quality resources
    in Arabic AES. TAQEEM 2025 attracted 11 registered teams for Task A and 10 for
    Task B, with a total of 5 teams, across both tasks, submitting system runs for
    evaluation. This paper presents an overview of the task, outlines the approaches
    employed, and discusses the results of the participating teams.'
