- id: 142
  file: 142.pdf
  abstract: 'Hallucination in Large Language Models (LLMs) remains a significant challenge
    and continues to draw substantial research attention. The problem becomes especially
    critical when hallucinations arise in sensitive domains, such as religious discourse.
    To address this gap, we introduce IslamicEval 2025—the first shared task specifically
    focused on evaluating and detecting hallucinations in Islamic content. The task
    consists of two subtasks: (1) Hallucination Detection and Correction of quoted
    verses (Ayahs) from the Holy Quran and quoted Hadiths; and (2) Qur''an and Hadith
    Question Answering, which assesses retrieval models and LLMs by requiring answers
    to be retrieved from grounded, authoritative sources. Thirteen teams participated
    in the final phase of the shared task, employing a range of pipelines and frameworks.
    Their diverse approaches underscore both the complexity of the task and the importance
    of effectively managing hallucinations in Islamic discourse.'
