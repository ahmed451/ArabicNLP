- id: 134
  file: 134.pdf
  abstract: 'We present an overview of the AraGenEval shared task, organized as part
    of the ArabicNLP 2025 conference. This task introduced the first benchmark suite
    for Arabic authorship analysis, featuring three subtasks: Authorship Style Transfer,
    Authorship Identification, and AI-Generated Text Detection. We curated high-quality
    datasets, including over 47,000 paragraphs from 21 authors and a balanced corpus
    of human- and AI-generated texts. The task attracted significant global participation,
    with 72 registered teams from 16 countries. The results highlight the effectiveness
    of transformer-based models, with top systems leveraging prompt engineering for
    style transfer, model ensembling for authorship identification, and a mix of multilingual
    and Arabic-specific models for AI text detection. This paper details the task
    design, datasets, participant systems, and key findings, establishing a foundation
    for future research in Arabic stylistics and trustworthy NLP.'
