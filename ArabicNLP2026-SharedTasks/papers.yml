  title: 'Orni at StanceEval-2026: Arabic Stance Detection with Reasoning-Augmented
    LLM Prompting and Encoder Ensembles'
- abstract: StanceEval-2026 tests Arabic stance classification under target shift,
    with evaluation targets absent from the labelled task data. We test two ways to
    supply target information at inference time. For Track 1, we retrieve eight labelled
    Women Driving demonstrations from the external ArabicStanceX corpus and score
    the three label tokens with Gemma-4-31B-IT. For the unseen-target track, we prepend
    cached target context prompted to be factual and non-evaluative, then fuse label
    predictions and label-token scores from multiple LLMs, with final assignments
    constrained by published class totals. The systems obtain 85.22 and 91.78 $F_{\mathrm{avg2}}$
    on Tracks 1 and 2, ranking sixth and fourth in the final standings. On held-out
    ArabicStanceX tweets, direct prompting scores 79.45 $F_{\mathrm{avg2}}$; eight
    random Women Driving demonstrations raise it to 84.78, and similarity retrieval
    reaches 89.04. Across three target-held-out Mawqif evaluations, a fixed target
    card raises Gemma-4-31B-IT from 86.54 to 86.93, whereas QLoRA lowers Gemma-4-12B-IT
    from 84.43 to 83.77. In these separate public evaluations, same-target demonstrations
    and retrieval improve performance, factual target context provides small, target-dependent
    gains, and the tested source-only adapter does not improve.
