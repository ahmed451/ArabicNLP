- abstract: This paper presents the first investigation into the performance of the
    Conformer architecture for hierarchical text classification, specifically applied
    to predicting two-level Arabic text genres. The proposed system combines multilingual
    sentence embeddings, target label definition representations, a Conformer projection
    module, an auxiliary broad-genre classifier, synthetic data augmentation, and
    seed-based ensembling. Evaluated on the official shared task, the approach achieved
    a Hierarchical Macro-F1 of 0.4399, demonstrating strong high-level genre classification
    (Broad Macro-F1 of 0.6288) while highlighting ongoing challenges in distinguishing
    semantically close specific subcategories (Specific Macro-F1 of 0.2511).
