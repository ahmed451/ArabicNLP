  title: 'Anhnamxtanh at HalluScoring-2026: Counterfactual Cross-Checking for Hallucination
    Detection and Answer Verification in Islamic Knowledge'
- abstract: Large language models (LLMs) produce fluent but factually incorrect outputs
    which become significant when such models are applied to local languages, such
    as Arabic, because of the language’s complex morphology, dialectal richness, and
    the insufficient material available for training and evaluation. The competition
    HalluScoring-2026 Track 1 aims to address these problems and consists of two tasks
    that demand hallucination detection in Arabic question-answering settings. To
    solve this issue, we transfer the knowledge of a powerful reference-based teacher
    that is a stacked ensemble of five fine-tuned encoder classifiers with dynamic
    lexical, embedding, and entailment characteristics onto a simpler reference-based
    student model.
