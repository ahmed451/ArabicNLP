- abstract: 'We present SZED''s submission to ArGuard 2026 Track A: Arabic hateful
    meme detection. The task has two parts: binary classification (A1) and fine-grained
    multi-label tagging (A2). For A1, we fuse MARBERTv2 and CLIP ViT-L/14 embeddings,
    comparing concatenation, self-attention, and ensemble heads. For A2, we use a
    multi-task label-attention architecture with per-class query vectors and an auxiliary
    head for cascade calibration. We reach macro-F1 $= 0.7597$ on A1 and $0.3142$
    on A2. We report reproducibility across runs, per-class error patterns, and the
    effect of cascade calibration on the long-tailed A2 labels.'
