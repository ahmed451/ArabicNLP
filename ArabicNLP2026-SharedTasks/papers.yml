  title: 'CUNI at AlexandriaX-2026: Finetuning LLMs for dialectal Arabic Translation'
- abstract: 'Arabic encompasses diverse spoken varieties with limited parallel data,
    making both translation and automatic evaluation difficult beyond Modern Standard
    Arabic. We present the NAMAA Community submissions to all three AlexandriaX-2026
    subtasks: English-to-dialect dialogue translation, cross-dialect translation,
    and dialectal MT error detection. Our systems combine few-shot prompting, fine-tuned
    encoder-decoder and decoder-only models, and encoder- and LLM-based span detection.
    Held-out ablations show that minimum-Bayes-risk consensus can suffer from model-family
    imbalance; we therefore use per-dialect routing for translation and 2-of-3 character-level
    agreement for error-span detection. Our systems rank fourth and fifth of six in
    the unconstrained and constrained Subtask~1 tracks, third of four on Subtask~2,
    and second of six on Subtask~3. The Subtask~3 system achieves 0.5448 overlap-F1,
    exceeding the overall winner on span localization, with category assignment remaining
    the main weakness. Code and resources are publicly available.\footnote{\url{https://huggingface.co/collections/NAMAA-Space/namaa-at-alexandriax-2026}}'
