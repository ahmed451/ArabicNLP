  title: 'NAMAA Community at DialectSentEval 2026 Subtask 1: Dialect-Aware Arabic
    Sentiment Classification with Pretrained Transformer Models'
- abstract: 'Arabic sentiment swap aims to reverse the polarity of a dialectal sentence
    while preserving its underlying meaning. We present NAMAA''s system for DialectSentEval
    2026 Subtask~2. Fine-tuning AraT5v2 achieves 79.56 development sentiment-style
    accuracy, while reranked sampling over eight candidates, using sentiment agreement
    and content-overlap signals, raises this to 93.57. Cross-backbone ensembling further
    reaches a development score of 96.78. On the hidden test set, however, this ordering
    does not transfer: a widened rerank pool with a re-tuned content weight achieves
    our best official score of 0.7597, whereas the most complex all-source ensemble
    scores 0.7343. We identify two likely contributors to this development-to-test
    mismatch: the absence of gold source-polarity labels at test time, which requires
    classifier-based polarity inference, and train--development sentence duplication
    that may inflate development performance. These results show that additional generation
    and ensemble complexity can improve development metrics substantially without
    guaranteeing better generalization under shifted evaluation conditions.'
