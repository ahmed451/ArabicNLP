- abstract: 'We describe ENSAR, our submission to the

    AraSeg 2026 shared task on Arabic sentence

    segmentation, where a system must decide, for

    every word in a document, whether a sentence

    ends there. The four tracks strip punctuation,

    paragraph breaks, both, or neither. We start

    from an ensemble of five fine-tuned encoders

    decoded with a length-aware semi-Markov program. It is strong, but most of its
    mistakes are

    places where all five models are wrong and all

    five assign high confidence, so averaging them

    or moving a threshold changes nothing. ENSAR adds a reasoning stage on top. Two
    LLM

    juries, each holding a written policy learned

    from its own graded errors on the training split,

    debate every document and apply only the edits

    both endorse. Our system ranked first on three

    of the four tracks in both the closed and open

    settings.'
