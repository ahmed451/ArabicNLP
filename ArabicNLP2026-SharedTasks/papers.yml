  title: 'WathiqTeam at AraGenre 2026: Class-Balanced Hybrid Retrieval with Selective
    LLM Reranking'
- abstract: 'We report the first-place system in AraGenre 2026 (0.7352 Hierarchical
    Macro F1, 18 teams). The task assigns each of 27,972 hidden-test Arabic segments
    one of 6 broad and one of 74 specific genres, given only as English prose definitions,
    with the specific-label inventory disjoint from training. Our pipeline updates
    no model parameters but is not free of task-specific effort: the judge prompt
    carries 74 hand-written cues, and components were selected on the public leaderboard.
    A family-restricted, definition-guided LLM judge scores candidate genres setwise
    under a hierarchically constrained decoding scheme, whose five-step pipeline reaches
    0.7139. That base led on Specific Macro F1 but trailed on Broad Macro F1, so we
    add a correction stage: two instruction models re-predict the specific genre,
    each shown the entire 74-definition taxonomy, and a label is edited only where
    both agree against the base. That system scores 0.892 Broad Macro F1, alongside
    fewer topic-trap calls, where the subject a text discusses displaces the genre
    it instantiates. In a post-evaluation audit of instances that the base labelled
    as book descriptions, Religious calls fall 394 → 233 → 119 as the prompt adds
    the type-versus-topic convention and then the full taxonomy. Refinements and an
    attractor drain reach 0.7352.'
