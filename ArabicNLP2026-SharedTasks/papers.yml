- abstract: Cross-target Arabic stance detection presents a unique challenge due to
    the rich morphological complexity, regional dialects, and heavy reliance on sarcasm
    within social media discourse. In this paper, we describe the system submitted
    by Team Axiom for Track 1 (Seen Targets) of the StanceEval-2026 shared task. Our
    primary contribution is a resource-efficient, Two-Stage Hybrid Cascade architecture.
    This system utilizes a fine-tuned MARBERTv2 encoder as a high-confidence gatekeeper,
    dynamically routing uncertain and complex tweets to a locally hosted, 4-bit quantized
    Large Language Model (Llama-3.1-8B-Instruct). To prevent label bias and ground
    the LLM's reasoning, the fallback stage incorporates a dynamically balanced, class-specific
    TF-IDF sub-word retriever. Our official submission achieved an $F_{avg2}$ score
    of 0.6910 (Rank 18), demonstrating a measurable improvement over our standalone
    encoder baseline (0.6722).
