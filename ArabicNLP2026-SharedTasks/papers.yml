- abstract: 'We describe the Charles University (CUNI) submission to the AlexandriaX-2026
    Subtask 1, a shared task on English-to-Arabic dialectal conversation translation
    covering 13 Arabic varieties.

    Our approach fine-tunes Gemma-4-31B-it with QLoRA on the Alexandria training data
    at the conversation level, using rich contextual prompts that include domain metadata,
    participant names and speaker labels.

    We explore multiple training data mixes and hyperparameters, yielding a pool of
    candidate translations for the test set.

    These are reranked with a genetic-algorithm-enhanced minimum Bayes risk (GA-MBR)
    decoding using sentence-level spBLEU as the fitness function.

    Fine-tuning improves over the unmodified base model by approximately 5.2 ChrF
    points on the development set (from 45.2 to 50.4 ChrF for the best single checkpoint,
    or 25.1 to 32.6 spBLEU); GA-MBR reranking over a 40-candidate development pool
    yields 51.3 ChrF / 34.0 spBLEU, a further improvement of 0.9 ChrF points over
    the best pool member. Our submission ranked second in the unconstrained track.'
