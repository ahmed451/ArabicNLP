  title: 'ArmyForRE at KnowledgeGraphEval 2026: Typed Entity Markers and Imbalance-Aware
    Training for Arabic Relation Extraction'
- abstract: This paper details our submission to KnowledgeGraphEval 2026 Subtask 2
    on directed Arabic relation extraction. We explored encoder-based and large language
    model approaches for predicting one of 40 relations or no_relation from an Arabic
    sentence and a subject–object pair. Our encoder systems use typed entity markers
    and separate relation-existence and relation-classification heads, while our LLM
    systems fine-tune Yehia and Qwen3.5 with QLoRA and ontology-constrained prediction.
    Our best system, an ensemble of Yehia-RE, Qwen-RE, and TypedPair, achieved a micro-F1
    score of 94.06 and ranked 1st in Subtask 2. Yehia-RE (full-vocabulary) achieved
    92.98, while the best encoder and Qwen-RE achieved 92.69 and 91.94 respectively.
    Our results highlight the importance of constrained prediction and complementary
    modeling approaches for Arabic relation extraction.
