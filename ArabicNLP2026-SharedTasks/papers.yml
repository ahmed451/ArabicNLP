  title: 'IslamicEval 2026: The Second Shared Task of Capturing LLMs Hallucination
    in Islamic Content'
- abstract: 'This paper describes our submission to the IslamicEval 2026 Task~1 (Span
    Detection) shared task, which aims to identify and classify evidence spans in
    AI-generated Arabic Islamic answers. We formulate the task as token-level sequence
    labeling and fine-tune CAMeLBERT-Mix using BIO tagging, overlapping-window inference,
    and prediction reconciliation to detect four evidence categories: Ayah, matn,
    isnad, and claimed\_source. On the official development set, our approach achieves
    a Precision of 95.55\%, Recall of 97.06\%, F1-score of 96.30\%, and Token Accuracy
    of 98.66\%. Multi-seed and qualitative analyses demonstrate the robustness of
    the proposed framework for Arabic evidence span detection.'
