- abstract: 'We present the results and findings of the BAREC Shared Task 2026, the
    second shared task on Arabic readability assessment, organized as part of the
    Fourth Arabic Natural Language Processing Conference (ArabicNLP 2026).

    The shared task focuses on automatic readability assessment using the BAREC Corpus,
    addressing fine-grained classification across 19 readability levels.

    It comprises two subtasks —sentence-level classification and document-level classification—
    and three tracks: (1) the Strict Track, which permits only the BAREC Corpus; (2)
    the Constrained Track, which permits the BAREC Corpus, the SAMER Corpus, and the
    SAMER Lexicon; and (3) the Open Track, which permits the use of any external resources.

    A total of 14 teams from 12 countries registered for the task, of which 10 submitted
    system description papers.

    All participating teams competed only in the sentence-level classification subtask.

    The top-performing system achieved a quadratic weighted kappa (QWK) of 85.3.'
