- abstract: 'We describe our submission to NADI-2026 Subtask~2, country-level spoken
    Arabic dialect identification on a blind test set from undisclosed sources. Because
    the target domain is unknown at development time, we select on out-of-domain accuracy
    rather than in-domain validation accuracy at every decision point, comparing three
    backbones under a common pooling-plus-linear head and training the selected Arabic
    ASR encoder on ADI20-micro mixed with Casablanca. The system reaches 91.54\% in-domain,
    73.10\% on the held-out MADIS-5 corpus (scored five-way), and 52.51\% on the blind
    test set (\(C_{\mathrm{avg}}\) 0.11), placing fourth. The criterion helped, choosing
    an encoder that in-domain accuracy would have rejected by 32 points on a held-out
    corpus, a gap more than twenty times

    our measured seed variation, but it was not sufficient: of the 39.03-point in-domain
    to blind gap, at least 18.44 points are attributable to leaving the training domain.
    We trace part of the remainder to a corpus that entered the training mixture while
    still being used for checkpoint selection.'
