  title: 'L3IA Morocco at ArGuard 2026: Intent over Words - Uncovering Implicit Harm
    in Arabic LLM Prompts'
- abstract: 'We present AK_QMUL''s submissions to the ArGuard-2026 shared tasks on
    Arabic harmful-prompt detection: a binary safe/unsafe task (B1) and a seven-way
    harm-domain task (B2). Both submissions use one backbone -- JAIS-6.7B fine-tuned
    with 4-bit QLoRA and a linear classification head over its last-token representation.
    For B1 we train a four-way head that factors the label by dialect register {safe,
    unsafe} × {MSA, other}, we augment the training fold with MSA prompts from AraSafe,
    and decode with a plain argmax to score safe/unsafe. For B2 we fine-tune the same
    backbone as a seven-way classifier and average the softmax outputs of five random
    seeds. Both submissions ranked first on their track, with macro-F1 0.984 on B1
    and 0.790 on B2. We report results by dialect and by class: on B1 the model is
    accurate across all six dialects (93.6--99.8%) and its predicted unsafe rate tracks
    the true rate closely; on B2 six of the seven classes reach F1 between 0.73 and
    0.98, with the residual error concentrated in the Bully class, which overlaps
    semantically with harassment and harm-to-others.'
