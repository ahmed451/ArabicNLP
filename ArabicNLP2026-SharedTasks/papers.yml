- abstract: Detecting hate speech in social media memes requires disentangling complex
    cross-modal interactions, a challenge magnified in low-resource and morphologically
    rich languages like Arabic. We present Team Axiom's submission to the ArGuard
    2026 Shared Task (Task A1) on binary hate meme classification. While conventional
    multimodal wisdom posits that text and visual features must be jointly fused,
    empirical evidence across non-English domains reveals that noisy visual backbones
    and cross-modal space misalignment frequently degrade language signals. We validate
    this hypothesis by fine-tuning a unimodal MARBERTv2 sequence classifier without
    external multimodal fusion. Our simple, well-regularized approach achieved a Macro-F1
    of 0.770 and an accuracy of 0.818 on the official gold test set, securing 6th
    place on the global leaderboard and outperforming both the official AraBERTv2
    baseline and our own complex multimodal fusion architectures.
