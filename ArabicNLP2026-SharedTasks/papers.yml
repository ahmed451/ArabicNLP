- abstract: 'This paper presents the CIC system for ArGuard 2026 Subtask B2, which
    classifies unsafe Arabic prompts into one of seven harm domains. Our system combines
    four complementary components: a fine-tuned CAMeLBERT-Mix model, a modified-Huber
    stochastic gradient descent classifier, a character-level nearest-neighbor model,
    and a character class-centroid similarity model. On the development set, we achieved
    a Macro-F1 score of 0.916 and an accuracy of 0.923. On the test set, the proposed
    model achieved an accuracy of \textbf{0.766}, a macro precision of \textbf{0.760},
    a macro recall of \textbf{0.763}, and a Macro-F1 of \textbf{0.751}. The results
    show that combining contextual transformer representations, lexical features,
    and retrieval-based similarity signals can improve fine-grained harmful-prompt
    classification.'
