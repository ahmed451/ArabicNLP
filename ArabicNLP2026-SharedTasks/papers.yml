  title: 'AlexandriaX 2026: The First Shared Task on Dialectal Arabic Machine Translation'
- abstract: We present TTLab's submission to the AlexandriaX-2026 Subtask 3 on Arabic
    MT error span detection and classification. Our system frames the task as token-level
    classification over surface forms, preserving character offsets to ensure exact
    alignment with the evaluation metric. To handle severe label imbalance, we employ
    a focal loss with class weighting and dialect-specific decoding thresholds. Among
    six Arabic pre-trained encoders, MARBERTv2 achieves the best overall performance
    of 40.8 and 40.91 on the development and test set, respectively, ranking 3rd out
    of all participating teams. While our system localizes error spans effectively,
    classification of rare error types remains challenging, highlighting the need
    for data augmentation for tail categories.
