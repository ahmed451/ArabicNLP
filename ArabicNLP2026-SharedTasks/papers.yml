  title: 'Makeen at AISA-ArabicFC: Grounding LLM via Extracted Spans and Generalization
    Trade-off in Arabic Function Calling'
- abstract: 'Arabic Function Forge is our submission to AISA-ArabicFC 2026. Our system
    is training-free: it uses a single off-the-shelf open-weights model, prompted
    once per request, with no parameter updates. It placed fifth on Track A, fourth
    on Track B, and sixth on Track C. Our central observation is that function selection
    is nearly saturated on this benchmark while argument extraction is not: we reach
    0.9893 function accuracy but only 0.8686 argument exact match, so 94.9\% of the
    remaining headroom lies in arguments. The dominant failure is not misunderstanding
    but over-interpretation: the model translates values, converts dates to ISO form,
    and adds fields the user never provided. Our system is designed to suppress this
    behaviour by preserving argument values as written. We further find that the dialect
    penalty is concentrated rather than graded, with most of the drop occurring on
    Maghrebi.'
