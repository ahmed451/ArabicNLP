  title: 'Bayan_CU at IslamicEval 2026: Fine-Grained Hallucination Span Detection
    in Arabic Quranic and Hadith Texts'
- abstract: 'We describe the Qahera system for the four IslamicEval 2026 subtasks:
    (1) detecting Qur’an/Hadith citation spans in LLM-generated Islamic answers, (2)
    judging citation authenticity, (3) correcting inauthentic citations against reference
    corpora, and (4) judging whether an

    authentic citation answers the question asked. Under a 13B-parameter open-model
    constraint, running entirely on free Kaggle GPUs, we combine a lightweight token-classification
    model with character-level auxiliary features (Sub-task 1), corpus-grounded fuzzy
    retrieval (Sub-tasks 2–3), and a 4B-parameter instruction-tuned LLM (Gemma-3-4B)
    used only where retrieval alone cannot discriminate (Subtasks 3–4). Rather than
    hand-designing LLM prompts once, we develop them through an iterative propose-evaluate-diagnose
    search loop that reads full prediction traces after every candidate and hunts
    for systematic biases before each change. This surfaces small-model failure modes
    – a near-universal “reject” bias in isolated yes/no verification, and an “always
    name something” bias in numbered-list prompts – that would otherwise silently
    cap performance, and shows that validating candidates on small subsets can be
    actively misleading. Our final system reaches 0.9716 F1 (Subtask 1), 0.906 accuracy
    (Subtask 2), 0.773 accuracy (Subtask 3), and 0.673 macro-F1 (Subtask 4) on the
    official

    test sets.'
