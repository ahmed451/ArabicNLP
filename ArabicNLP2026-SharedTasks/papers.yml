  pdf_file: c7a134d238c9174b6dc03893f7eefd2fe9e88326.pdf
  title: 'Nile Nexus at ImageEval 2026 Shared Tasks: Single-Choice Reformulation and
    Confidence-Calibrated Refinement for Culturally Grounded Hallucination Detection'
- abstract: 'We present the Team Falcons system for the ImageEval 2026 Task 1b English
    track. The task provides culturally grounded images from the OASIS/EverydayMMQA
    resource family and three English statements per image, exactly one of which is
    visually supported\citep{imageeval-2026,alam2025everydaymmqa,mousi-etal-2026-correct}.
    Rather than treating the statements as independent binary decisions, we exploit
    this structural constraint and formulate each item as image-conditioned three-way
    classification. In Stage 1, we fine-tune Qwen3-VL-8B\citep{bai2025qwen3vl} with
    4-bit QLoRA\citep{dettmers2023qlora,hu2022lora} and estimate uncertainty from
    the first-token probabilities assigned to A, B, and C. Stage 2 we send only examples
    whose top-two probability margin is below 0.90 to Gemini 3.6 Flash and GPT-5.4-mini.
    Their answer replaces the Stage 1 prediction only when both verifiers return the
    same valid option. On the official test set, Stage 1 obtains a Contrastive Instability
    (CI) of 0.0360 and Combined Accuracy of 0.9640. Consensus verification improves
    these scores to 0.0290 and 0.9710, respectively, placing our submission first
    on the Task 1b English leaderboard. After test labels were released, we found
    that the verifiers agreed on 91 of 138 routed items and changed 17 predictions:
    12 corrections and 5 harmful revisions. These results show that structure-aware
    fine-tuning and conservative uncertainty routing can effectively combine a local
    open-weight VLM with proprietary multimodal verifiers.'
