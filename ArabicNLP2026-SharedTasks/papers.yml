  pdf_file: 28931c7ab02b1407cda2b911055b942f299eb888.pdf
  title: 'BME-Daleel at Daleel 2026: Joint Modeling, Structured Decoding, and Domain-Routed
    Ensembles for Arabic Argument Units'
- abstract: Argument Mining (AM) is a critical NLP task that remains significantly
    under-resourced in Arabic. This paper presents STAR-Ar, a BERT-BiLSTM-CRF architecture
    for argument discourse detection and classification, as our system for Daleel
    2026, the inaugural Arabic argument mining shared task. The task requires the
    identification and classification of argumentative discourse units (ADUs) in debate
    and editorial texts. We jointly model these two objectives as a token-level sequence
    labeling task using a BERT-BiLSTM-CRF architecture that combines contextual transformer
    embeddings with structural transition constraints to support accurate span detection.
    STAR-Ar achieves an F1-score of 72.69 on validation and 73.7 on test data.  Our
    domain-specific analysis shows that models trained exclusively on editorials underperform
    those trained on debates, a disparity we primarily attribute to the smaller size
    of the editorial dataset.
