  title: 'VisionEval at ImageEval 2026 Shared Tasks: Forced-Choice Reformulation for
    Hallucination Detection and a Version-Prior Baseline for Cultural Relevance'
- abstract: Large multimodal models tend to hallucinate visual detail fluently, which
    limits their deployment for fine-grained interpretation. We present HALDETECT,
    our system for the English hallucination-detection track (Task 1b) of ImageEval
    2026, in which a system must identify, from an image and three culturally plausible
    statements, the single visually grounded one. We frame the item as one contrastive
    decision, emit the answer before its explanation, and structure reasoning around
    colour/texture, shape/form, and context. Our best submitted adapter fine-tunes
    Qwen2.5-VL-7B-Instruct with 4-bit QLoRA while freezing the vision encoder and
    reaches Contrastive Instability (CI) 0.035 on the 1,000-item test set; we placed
    third of eight teams. Development experiments show that answer order can matter
    more than model scale and that adaptation beats prompting alone. Retrospective
    paired analysis of the released gold labels confirms the QLoRA gain over the best
    prompt but not the small gap between the devtest-selected and best-test adapters,
    and reseeding all four training sizes shows that the apparent data-scaling curve
    does not survive a seed change. The 35 residual errors are culturally plausible
    function, material, and recognition distinctions; naive adapter voting does not
    help.
