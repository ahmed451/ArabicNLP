  title: 'Skywalker at BAREC Shared Task 2026: Multi-Expert PLM Fusion and QWK-Aware
    Ordinal Decoding'
- abstract: Fine-grained Arabic readability assessment is challenging due to the language's
    rich morphology and the ordered nature of readability labels. We investigate this
    problem in the sentence-level Strict Track of the BAREC Shared Task 2026, which
    uses a 19-level readability scale. We evaluate six controlled configurations spanning
    engineered linguistic and morphological features, TF-IDF/SVD lexical representations,
    contextual transformer encoders, multi-encoder fusion, output-level ensembling,
    and ordinal-aware training, followed by a final refinement using a single EmbeddingGemma
    encoder. Contextual transformer representations provide the largest improvement
    over classical feature-based baselines, while multi-encoder fusion and voting
    yield smaller additional gains. In contrast, word-repetition and adjacent-word-swap
    augmentation degrades performance, indicating that these perturbations do not
    reliably preserve readability labels. Our strongest configuration combines EmbeddingGemma
    with Gaussian soft labels, KL-divergence training, expected-value decoding, class
    weighting, and best-checkpoint selection, achieving 84.0 QWK on the test set and
    82.4 QWK on the official blind test set. Overall, the results suggest that explicitly
    accounting for the ordinal structure of readability labels is a promising alternative
    to simply increasing architectural or ensemble complexity. We further summarize
    the resulting design insights into a practical framework for Arabic ordinal readability
    modeling.
