  title: 'NLPBeasts at AraSeg Shared Task 2026: A Character-Word BiLSTM-CRF for Paragraph-Aware
    Arabic Sentence Segmentation'
- abstract: 'We describe our submission to the AraSeg 2026

    shared task on Arabic sentence segmentation

    (Paragraph-Aware, Closed track). We cast segmentation as binary token-boundary
    classification and build a system around three ideas: (i)

    task-adaptive pretraining (TAPT) of encoders

    on the task’s own training text, (ii) regularized

    fine-tuning with R-Drop and boundary smoothing, and (iii) a hand-designed cross-family
    ensemble of architecturally diverse Arabic encoders. Our final system reaches
    a boundary

    F1 of 94.8 on the blind test set (ranking 3rd

    of 12 teams, 0.5 points from the top-ranked

    team). Beyond the score, we report a practical finding backed by a series of blind
    submissions: on a small development set, a compact diversity-first ensemble generalizes
    better

    to unseen data than ensembles selected by exhaustively maximizing development
    F1, and

    TAPT helps only under-adapted backbones

    while hurting a heavily-pretrained one. We

    also report five techniques that did not help, to

    save future practitioners the effort. Our code

    is publicly available at https://github.com/Body123/araseg-2026-knights-st.'
