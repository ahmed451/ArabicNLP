- abstract: Hierarchical, definition-guided genre classification places a short Arabic
    text under a broad genre and, within it, a fine-grained specific genre, using
    only a natural-language definition of each. We present NAMAA's submission to AraGenre
    2026. Fine-tuned bi-encoder classifiers reached 0.93 hierarchical macro F1 on
    development via data augmentation and cross-lingual pretraining, but collapsed
    to as low as 0.22 on the released test set, having specialized to a hand-engineered
    definition style that missed the test set's larger, 74-genre taxonomy. We root-caused
    this gap and switched to zero-shot LLM classification, matching the best fine-tuned
    ensemble's test score (0.6899 hierarchical F1) with no training; layering self-consistency
    sampling and disagreement resolution raised this further to 0.7013, ranking 3rd
    of 18 teams. Specific Macro F1 (0.5114) lags well behind Broad Macro F1 (0.8913),
    showing that most remaining errors concentrate in fine-grained genre choices rather
    than broad-category mistakes. Zero-shot LLM prompting generalizes across this
    definition and taxonomy shift where fine-tuned, definition-conditioned encoders
    do not. We release our code and system resources to support reproducibility and
    further research.\footnote{\url{https://github.com/NAMAA-ORG/Aragenre-Definition-Guided-Genre}}.
