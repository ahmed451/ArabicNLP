  pdf_file: c08e51c6d820e8c014d8877345d6a7f3167b23af.pdf
  title: 'dbilianos at ArGuard Shared Tasks: When Does Translation Help in Arabic
    Harmful Prompt Detection?'
- abstract: 'Arabic harmful-prompt detection has remained challenging due to dialectal
    variation, implicit expressions and context-dependent intent. In the ArGuard 2026
    Shared Task, we have participated in Subtask B1, a binary safe/unsafe classification
    task scored by macro-F1. We have identified evaluation leakage in an initial pipeline:
    the development set has been reused for early stopping, threshold tuning and ensemble
    optimization, which has inflated development scores while masking poor generalization
    on the blind test set. To correct this, we have introduced a leakage-controlled
    protocol with separate fitting, checkpoint-selection and tuning splits and have
    compared a TF-IDF SVM baseline, MARBERTv2 and a stacking ensemble, selecting the
    best-performing method based on tuning-set results. We have further applied five
    rounds of error-driven data augmentation to address recurring failure patterns.
    Our final system has achieved 0.861 accuracy, 0.878 precision, 0.862 recall and
    0.860 macro-F1 on the blind test leaderboard, ranking 5th. Manual error analysis
    has shown that remaining errors have mainly stemmed from false positives on sensitive
    but non-harmful content, confirming that leakage-controlled evaluation has been
    necessary for a reliable blind-test estimate.'
