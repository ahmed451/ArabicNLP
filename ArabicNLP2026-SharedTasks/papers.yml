  title: 'ZHR at StanceEval-2026: Surface-Matched Synthetic Demonstrations and Metric-Aware
    Decoding for Arabic Cross-Target Stance Detection'
- abstract: 'We present an overview of the **ImageEval 2026** shared task on culturally
    grounded Arabic multimodal evaluation. It includes two tasks: (i) **AynVQA**,
    covering spoken visual question answering and image-grounded hallucination detection
    in English and Modern Standard Arabic (MSA), and (ii) **CRAI-Bench**, evaluating
    the cultural accuracy of text-to-image generation. A total of 14 teams participated
    in the test phase, with 12 teams submitting system description papers. Participating
    systems used a range of approaches, including zero-shot prompting, fine-tuning
    of vision-language models, speech-recognition pipelines, ensembling, and score
    calibration. We describe the task setup, datasets, evaluation procedure, and participating
    systems, and summarize the main results across the different tracks. All datasets
    and evaluation scripts from the shared task are released to the research community.
    The shared task highlights challenges in culturally grounded multimodal evaluation,
    particularly for Arabic speech and image-text reasoning.'
