  title: 'Dynamos at ImageEval 2026 Shared Tasks: Metric-Aligned Selection and Cross-Family
    Ensembling for Vision-Language Hallucination Detection in English and Arabic'
- abstract: 'The increasing adoption of multimodal large language models (MLLMs) has
    enabled more natural interaction with visual and spoken information, creating
    new opportunities for intelligent audio-visual question answering (AVQA) and hallucination
    detection systems. AVQA

    extends traditional visual question answering by requiring models to jointly understand
    an input image and a spoken question to generate accurate, context-aware responses.
    Despite recent advances, AVQA and hallucination detection tasks remain challenging
    for modern

    standard Arabic (MSA) due to the limited availability of multimodal datasets and
    the need to reason across Arabic speech and text modalities alongside visual inputs.
    In this paper, we present an MLLM-based framework for AVQA that takes an image
    and a spoken question as input and generates answers. In addition, we utilized
    this framework to detect hallucination in text-image pairs. The proposed approach
    is evaluated on the ImageEval 2026 Task (Ayn-VQA) benchmark, which focuses on
    culturally grounded Arabic AVQA. Experimental results demonstrate that the proposed
    framework effectively understands spoken queries, grounds their responses in the
    visual content, and produces accurate answers. The results underscore the capacity
    and limitations of different LLM architectures for both English and MSA and under
    various conditions.'
