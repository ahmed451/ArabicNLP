  title: Arabic Sentence Segmentation Shared Task 2026
- abstract: 'Arabic sentence segmentation without punctuation or paragraph breaks
    requires predicting boundaries from context. The AraSeg Open Track supplies a
    parallel punctuated view, but its marks do not consistently indicate sentence
    endings. We train two CAMeLBERT-MSA ensembles, one for the target No-Punctuation
    No-Paragraph view and one for the auxiliary No-Paragraph view. A discrete rule
    combines their boundary decisions with punctuation classes projected onto the
    target words. Model fitting and selection use only the 174-document official training
    split: five-fold cross-validation selects the training duration, and out-of-fold
    predictions calibrate the decoders and fusion rule. Development is reserved for
    evaluation, and the public test is unused. The system achieves 84.61 document-macro
    F1 on development and 84.88 on the official blind test, with blind precision of
    81.87 and recall of 89.50. It predicts too many boundaries in 80.6% of development
    documents, although some of its lowest scores result from missed boundaries.'
