- abstract: 'The classification task for ArGuard 2026 Track

    A, Subtask A1, identifies whether an Arabic

    meme is Hateful or Not Hateful. Our system

    combines three separately trained models. In

    the first experiment, we use word-level and

    character-level features with balanced linear

    classifiers. In the second experiment, we fine-

    tune MARBERT for text classification using

    class-balanced focal loss. In the third experi-

    ment, we use a frozen SigLIP image encoder

    with balanced logistic regression. We combine

    the Class-1 probabilities from the three mod-

    els using late fusion. On the test set, the fused

    model achieved a Macro-F1 score of 0.76 and

    an accuracy of 0.79'
