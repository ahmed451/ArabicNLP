  title: 'LahjaMT at AlexandriaX-2026: A Context-Aware English-to-Dialectal Arabic
    Machine Translation System with Lightweight Routing of LoRA Experts'
- abstract: This paper describes team Alkhder's submission to Subtask~1 of the AlexandriaX-2026
    shared task, which asks systems to translate English dialogue turns into thirteen
    Arabic dialects. We fine-tune NileChat-3B-Base with QLoRA on the Alexandria parallel
    dialogue corpus, training one set of adapter weights for all dialects. Each turn
    is translated conditioned on the target country and dialect, the domain, the participant
    roles, the speaker–addressee gender direction, and the preceding dialogue context.
    At inference, conversations are translated autoregressively and the model is fed
    its own previous outputs back as context without using any gold target-side test
    information. Under the constrained-track, using only Alexandria data, it trains
    in about one hour and translates the private test set in under two hours. The
    system reaches a country-macro-averaged spBLEU of 20.36 and chrF++ of 36.64, on
    both tracks.
