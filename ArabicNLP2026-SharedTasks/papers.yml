- abstract: This paper describes the Northwestern University in Qatar submission to
    the AraGenre 2026 Shared Task on hierarchical Arabic genre classification. We
    formulate the task as a definition-guided dense retrieval problem by encoding
    Arabic documents and English genre definitions into a shared semantic space using
    the multilingual BGE-M3 model. Genre labels are assigned by retrieving the most
    semantically similar definition without task specific fine tuning. On the development
    set, the proposed approach achieved a Broad Macro F1 of 0.6125, a Specific Macro
    F1 of 0.6125, and a Hierarchical Macro F1 of 0.6125. These results show that a
    lightweight retrieval based framework is an effective approach for hierarchical
    Arabic genre classification.
