  title: 'TextLing at ArGuard Shared Tasks: An Enhanced MARBERT-Based Late-Fusion
    Model for Multimodal Hateful Meme Detection in Arabic'
- abstract: This paper presents SATLab’s participation in the ArGuard 2026 shared
    sub-task on identifying seven types of harmful LLM prompts in Arabic. The proposed
    system is language-agnostic and requires no resources other than the training
    data provided in the shared task. It is based on character n-grams and a logistic
    regression classifier. Performance on the Test set (Macro-F1 = 0.736) was average,
    approximately 0.05 lower than that of the top teams (0.790) and approximately
    0.05 higher than the baseline (0.687). Notably, this performance was substantially
    lower than those achieved in cross-validation and on the Development set. Several
    analyses aimed at understanding these discrepancies are reported. An analysis
    of the confusion matrix indicates that the “Harm-to-other” category poses the
    greatest problem, likely because it is partially compatible with all other categories
    except “Adult-content”.
