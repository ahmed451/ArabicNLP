- abstract: 'Large language models may generate inaccurate Islamic citations when
    answering religious questions. We present the Namaa Community system for Subtask~2
    of IslamicEval~2026, which identifies hallucinations in Qur''anic verses (Ayah),
    hadith texts (matn), chains of narration (isnad), and claimed sources. We formulate
    the task as retrieval-grounded verification: citation spans are normalized and
    matched against the Qur''an and the six major hadith collections using character
    $n$-gram retrieval and edit-distance re-ranking. Type-specific verifiers assess
    Ayah and matn similarity, while claimed sources and isnads are checked against
    their parent citations. The deterministic pipeline requires no language model
    or GPU, and every decision is traceable to a canonical record. It achieves a macro
    accuracy of $0.\devMacro$ on the development set, $17.9$ percentage points above
    a per-type majority-class baseline, and $0.\testMacro$ on the official blind test;
    we trace most of that shortfall to a submission-time configuration error and decompose
    the remainder by segment type. Our code and submissions are publicly available.\footnote{\coderepo}'
