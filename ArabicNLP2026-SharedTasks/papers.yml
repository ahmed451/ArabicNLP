  title: 'Ahmed Younis at ArGuard Shared Tasks: Calibration Is Most of What You Tune:
    Decode-Time Structure and Threshold Transport for Arabic Harmful-Content Detection'
- abstract: Multimodal hate speech detection requires interpreting how an image and
    its accompanying text jointly construct a target, stance, or derogatory implication.
    In Arabic memes, this relation is often shaped by locally recognizable public
    figures, political references, visual analogies, and indirect humor, making either
    modality insufficient on its own. We tackle this problem in Track A of ArGuard
    2026, covering binary hateful meme detection (A1) and fine-grained multi-label
    classification (A2). Our experiments compare jointly trained dual encoders, parameter-efficient
    vision–language model (VLM) adaptation, and training-free prompting. We fine-tune
    Qwen3-VL, Llama 3.2 Vision, and Gemma 4 with QLoRA using task-specific binary
    and multi-label objectives. We also build CLIP–MARBERTv2 and SigLIP–AraBERT-Twitter
    cross-attention systems and evaluate frozen VLMs with zero-shot prompting and
    in-context learning. Qwen3-VL achieves our highest A1 score (0.7610), while SigLIP–AraBERT-Twitter
    leads A2 (0.3851), where label sparsity and multi-label prediction remain challenging.
