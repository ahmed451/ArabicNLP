  title: 'Gradient Descenders at DialectSentEval 2026: A Comparative Study of Pretrained
    Arabic Transformers for Multi-Dialect Sentiment Analysis'
- abstract: 'Sentiment analysis of regional Arabic dialects presents a formidable
    challenge due to severe orthographic variation, morphological complexity, and
    a scarcity of annotated resources. To tackle these linguistic hurdles within Subtask-1
    of the DialectSentEval 2026 Shared Task, team Axiom proposes a heavily regularized,
    dialect-aware ensemble framework combining two domain-complementary language models:
    MARBERTv2 and AraBERTv2. Our pipeline incorporates preprocessed dialect tags appended
    directly to input sequences, Stochastic Weight Averaging (SWA) for flat-minima
    convergence, and simple probability averaging across model outputs. Empirical
    results on the hidden test set demonstrate the robustness of this approach, with
    our system securing 2nd place overall and achieving an official Macro F1-Score
    of 0.8211.'
