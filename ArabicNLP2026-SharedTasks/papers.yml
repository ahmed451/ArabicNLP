  title: 'SparkShield at ArA-DF 2026: Robust Arabic Speech Deepfake Detection via
    Realistic Audio Augmentation and Multi-Scale XLS-R Score Fusion'
- abstract: 'This paper describes the system submitted by team $\textbf{PogranichnyZashchitnik}$
    to the ArA-DF 2026 shared task on Arabic Audio Deepfake Detection.

    We build on $\textbf{WavLM Large}$ as a self-supervised feature extractor, fine-tuned
    with $\textbf{Low-Rank Adaptation (LoRA)}$ so that only a small fraction of parameters
    need updating.

    Representations from all 25 hidden layers are blended via a $\textbf{learnable
    weighted sum}$, pooled into utterance-level embeddings with $\textbf{Attentive
    Statistics Pooling}$, and classified by an $\textbf{OC-Softmax}$ head that treats
    bonafide speech as the target class.

    Combined with an augmentation pipeline of codec compression, additive noise, and
    reverberation, this single system achieves $\textbf{12.54\\%}$ EER on Track 1
    (Dialect Generalization, 14th/15) and $\textbf{5.66\\%}$ EER on Track 2 (Acoustic
    Robustness, 8th/14), outperforming the organizer baseline on both tracks.

    Post-evaluation analysis shows that utterances shorter than two seconds are disproportionately
    difficult, and that a non-trivial fraction of spoofed samples are scored as confidently
    bonafide under dialect mismatch.'
