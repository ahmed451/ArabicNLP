  title: 'Thakaa at StanceEval-2026: Inference-Time Target Grounding for Arabic Stance
    Detection'
- abstract: We describe the ZHR system for both tracks of StanceEval-2026, Arabic
    stance detection on Mawqif-XT, where Track 1 evaluates on seen targets and Track
    2 on unseen ones. The system combines fine-tuned Arabic encoders, a few-shot classifier
    that retrieves labelled examples for a served instruction model, and generative
    models adapted with LoRA, and turns their blended probabilities into labels with
    a threshold rule that abstains to None unless one stance class is probable enough,
    with thresholds fixed on the development split. We report the whole sequence of
    experiments, including eight that lowered $F_{\mathrm{avg}2}$ and were not adopted.
    The main finding is that transfer to a new target is carried by the demonstrations,
    the labelled examples retrieved into the prompt, rather than by the model itself.
    Generated on-target tweets in the example pool gave the largest gain on both tracks,
    matching the surface form of the test tweets helped where the target has a distinctive
    style, and doubling the examples hurt. Our official results are $F_{\mathrm{avg}2}$
    0.896 with accuracy 0.855 on Track 1, and $F_{\mathrm{avg}2}$ 0.940 with accuracy
    0.922 on Track 2. The strongest official baselines reach 0.8425 on the Track 1
    development set and 0.7475 on the Track 2 test set.
