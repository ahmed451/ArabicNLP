  title: 'Thakaa at AlexandriaX-2026: Who Gets the Final Say? Assigning Output Authority
    in Dialectal Arabic Machine Translation and Error Detection'
- abstract: We present the findings of the Arabic Sentence Segmentation (AraSEG) Shared
    Task, organized at the Fourth Arabic Natural Language Processing Conference (ArabicNLP
    2026). Given an Arabic document, the task requires systems to identify sentence
    boundaries and segment the text into coherent sentences. Systems are evaluated
    on the genre-diverse AraSEG corpus under four input settings that vary in punctuation
    availability and paragraph structure, each with a Closed Track restricted to the
    provided training data and an Open Track permitting publicly available external
    resources. 22 teams from 13 countries registered, 16 submitted systems, and 14
    submitted system-description papers. Across the eight subtask-track combinations,
    the best systems achieve F1 scores ranging from 89.1 to 95.3. Performance declines
    as segmentation cues are removed, with the largest drop occurring when both punctuation
    and paragraph structure are unavailable. Pretrained-encoder ensembles and careful
    prediction calibration emerge as the most effective approaches, while gains from
    LLMs, external data, and complex architectures vary across systems and settings.
