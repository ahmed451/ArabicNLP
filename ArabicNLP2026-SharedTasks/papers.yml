- abstract: The classification of Arabic prompts as Safe or Unsafe is the focus of
    this submission to ArGuard 2026 Subtask B1. We developed a lightweight hybrid
    classifier that combines lexical and semantic information. The lexical branch
    uses normalized word-level and character-level features with a class-balanced
    LinearSVC classifier. The semantic branch uses frozen multilingual E5 embeddings
    with a class-balanced logistic regression classifier. We combined the outputs
    of both branches using late fusion. On the development set, LinearSVC achieved
    a Macro-F1 score of 0.93, while the frozen E5 branch achieved 0.88. The final
    hybrid system achieved a Macro-F1 score of 0.93. On the test set, the submitted
    system achieved 0.78 accuracy, 0.83 precision, 0.70 recall, and 0.72 Macro-F1.
