  title: 'NAMAA Community at the BAREC Shared Task 2026: Ordinal-Aware Training for
    Fine-Grained Arabic Readability Assessment Beyond Architectural Scale'
- abstract: 'We describe the ZHR systems for the two sentence-level tracks of the
    BAREC 2026 Shared Task on Arabic readability assessment: Strict, where training
    is restricted to the BAREC training split, and Open, which allows any public data.
    Each sentence receives one of 19 ordinal levels, and systems are ranked by quadratic
    weighted kappa (QWK). Both tracks use one recipe. Arabic encoders are fine-tuned
    under five ordinal objectives and averaged with weights from greedy selection,
    and the averaged score is discretized by 18 thresholds fitted to maximize QWK;
    every fitted quantity uses the development split. The official Strict system,
    an ensemble of ten train-split models, scores 85.0 QWK on the blind set. The official
    Open system adds pretraining on the silver-labeled BAREC-10M corpus and restricts
    selection to members whose early stopping never touched the calibration split;
    it scores 85.2. Both clear the official baseline (82.5) by 2.5 and 2.7 QWK while
    trailing it in exact accuracy, a trade-off that comes from the metric itself and
    that we measure directly. Negative results are part of the record: a catalog of
    19 changes that did not help, each measured under a held-out protocol.'
