  title: 'Northwestern at AraGenre 2026 : Definition-Guided Dense Retrieval Using
    BGE-M3 for Hierarchical Arabic Genre Classification'
- abstract: AraGenre 2026 requires hierarchical classification of Arabic texts into
    evaluation-specific genres unseen during training, using supplied English definitions
    and taxonomy information. We present a transductive zero-shot system combining
    multilingual retrieval over multi-view label representations with per-genre z-normalization,
    calibrated Qwen3-8B candidate reranking, sibling-focused reranking, metric-aware
    macro-F1 decoding, and margin-gated shortlist widening. On the official 27,972-instance
    test set, the system achieves 0.5800 Hierarchical Macro F1, comprising 0.749 broad
    and 0.411 specific macro F1. Per-genre normalization provides the largest build-up
    improvement (+0.095), while an encoder-only diagnostic attributes +0.082 to LLM
    reranking. Calibrated log-probability fusion, multi-view labels, and decoding
    refinements provide further complementary gains.
