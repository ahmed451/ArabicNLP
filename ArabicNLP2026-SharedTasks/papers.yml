- abstract: 'Identifying sentence boundaries in Arabic text is a challenging token
    classification task due to extreme dialectal variations, the absence of rigid
    punctuation rules, and document lengths that frequently exceed the capacity of
    standard transformer models. In this paper, we describe Team Axiom''s submission
    to the Paragraph-Aware Open track of the AraSeg Shared Task 2026. We propose a
    highly regularized, dual-model ensemble combining MARBERTv2 and CAMeLBERT-MSA.
    To address the challenge of excessively long documents, we employ a sliding-window
    tokenization strategy. Furthermore, we adapt our base models to the task corpus
    using Domain-Adaptive Pretraining (DAPT). Our final system achieved a Macro-F1
    score of 90.2\% (Precision: 91.9\%, Recall: 89.5\%), securing 7th place in the
    shared task.'
