- abstract: 'This paper describes the system submitted by

    the phonghoang team for Track 1 (Seen Tar-

    gets) of the StanceEval-2026 shared task on

    Arabic stance detection, where models are

    trained on provided targets and evaluated on

    a related target within the same thematic do-

    main. We propose a two-stage framework to

    address this within-domain target shift. In the

    first stage, we fine-tune a Multi-Task MAR-

    BERT model that jointly learns stance, senti-

    ment, and sarcasm, further regularized with R-

    Drop and Stochastic Weight Averaging (SWA),

    achieving Favg2 of 0.8561 on the development

    set. In the second stage, we adapt to the test

    target (“Women Driving”) by combining con-

    trastive few-shot pseudo-labeling via a Large

    Language Model, fusion with an external Ara-

    bic stance dataset, and high-confidence samples

    filtered from a thematically related training tar-

    get. The resulting augmented training set is

    used to adapt our optimal Stage 1 architecture,

    achieving an official Favg2 of 0.8431 on the test

    set.'
