- abstract: 'We describe the CodeZone Research Group

    system for NADI 2026 Shared Task 2, spo

    ken Arabic dialect identification over Modern

    Standard Arabic and 19 country-level dialects

    under cross-domain evaluation. Our system

    ensembles an ECAPA-TDNN language identi

    fier fine-tuned on the shared task data with a

    Whisper-large-v3 dialect classifier that we fur

    ther adapt using waveform- and spectrogram

    level augmentation, fusing their log-softmax

    scores. This ensemble reaches 94.35% accu

    racy on in-domain validation but initially re

    tained only 25.40% on the official blind test, a

    collapse that affected every participating team.

    We show that about a fifth of this gap is a cali

    bration failure rather than a modelling failure:

    discarding per-class bias terms fit in domain

    raised official accuracy from 0.2540 to 0.3918

    and lowered the shared task’s average cost from

    0.2077 to 0.1515, and a softening temperature

    reduced cost further to 0.1469; neither change

    touched either model. Our submission ranked

    10th of 16 teams, and we show analytically why

    uniform additive score shifts cannot affect this

    metric while temperature scaling can.'
