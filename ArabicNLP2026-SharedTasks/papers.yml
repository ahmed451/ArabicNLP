  title: 'ArabicMTDiagnostics at AlexandriaX-2026: Detecting and Classifying Errors
    in Dialectal Arabic Machine Translation Outputs'
- abstract: 'Cross-dialect Arabic machine translation asks for translation between
    Modern Standard Arabic and regional dialects with almost no parallel text. We
    present a system for Subtask 2 of AlexandriaX-2026, built on two findings about
    where the gains come from. First, data was not the binding constraint: once our
    mined-and-synthetic recipe had decelerated to $+1.8%$ relative spBLEU per round,
    a single increase in LoRA capacity beat three further data-tuning rounds combined
    ($+8.9%$). Second, planned epoch budgets were consistently too short, and training
    past them was the largest single lever at every stage. We fine-tune NLLB-200-distilled-600M
    on a three-tier corpus of real, mined and synthetic pairs, then refine it with
    Direct Preference Optimization. Ablating three reward designs isolates a third
    finding: rewarding agreement with self-distilled references regresses real quality
    despite healthy training dynamics. Restricting the reward to references we trust,
    with a reference-free substitute for the two zero-resource dialects, yields a
    real gain that a further iteration gives back. Every configuration was scored
    on the official leaderboard. Our submission reached spBLEU 25.84 and chrF++ 39.02,
    ranking 2nd of 4 teams; post-evaluation experimentation reached 28.04.'
