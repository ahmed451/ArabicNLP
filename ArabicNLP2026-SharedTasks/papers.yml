  title: 'NLPLab at ArGuard Shared Tasks: Balancing Confidence Scores for Fine-Grained
    Classification of Unsafe Arabic Prompts Across Harm Domains'
- abstract: 'We describe our submissions to Task A of the ArGuard 2026 shared task
    on harmful-content detection in Arabic memes: binary hateful-meme detection (Subtask
    A1) and fine-grained multilabel categorization (Subtask A2). Our A1 system is
    a probability-averaging ensemble of 22 fine-tuned models: 18 Qwen3-VL vision-language
    members (8B and 32B) trained with LoRA and scored via first-token logits, and
    4 Arabic text-encoder members (MARBERTv2, AraBERTv02-twitter), combined at a fixed
    0.85/0.15 modality mix. The system ranked first on Subtask A1 with 0.8234 macro
    F1, 2.2 points above our best single member. For A2, six LoRA-tuned VLMs with
    sigmoid multilabel heads, an A1-consistency mask, and flat 0.5 thresholds scored
    0.3900 macro F1. Post-hoc analysis on the released gold labels shows that our
    single global threshold survived an unannounced 8-point drop in the share of hateful
    memes in the test set, and that most remaining errors in both subtasks separate
    benign sarcasm or humor from mockery aimed at a protected target.'
