  title: 'StanceEval 2026: The Second Stance Detection Shared Task'
- abstract: 'Arabic-language stance detection remains challenging, and previous shared-task
    systems have largely relied on multitask learning and ensembles. While these systems
    achieve state-of-the-art performance, their applicability and transferability
    are limited by the additional complexity introduced by multitask learning. To
    reduce this complexity, we introduce $\texttt{CLASP-Ar}$, which reformulates the
    task as cloze-style masked language modeling. In this approach, the target, predicted
    sentiment, and text are combined into a single prompt whose $\texttt{[MASK]}$
    prediction is restricted to a verbalizer-constrained label vocabulary.  When evaluated
    on the StanceEval-2026: Arabic Stance Detection Shared Task, our proposed approach
    achieves an $F_{\text{avg2}}$ score of $71.36\%$ on Track 1 and $74.14\%$ on Track
    2 test sets.'
