  title: '\d{S}aqr at AISA-ArabicFC: What Actually Influences Arabic Function Calling?'
- abstract: Argument exact-match (ArgEM) dominates the AISA-ArabicFC score. Under
    one prompt, a base gemma-4-12B-it reaches 0.9853 FnAcc but only 0.6940 ArgEM on
    dev, suggesting that argument convention rather than tool selection is the binding
    constraint. Fine-tuning on the provided train split raises ArgEM to 0.8880 while
    FnAcc increases only from 0.9853 to 0.9945, yet the model still fails 8.4% of
    the 10,500 positive training rows. Across rules, retrieval, prompting, selection,
    reranking, and fusion, dev-selected gains did not consistently transfer beyond
    development; smaller gains from other tested interventions remain unresolved.
    Explicit convention cards add 7.5 ArgEM points on a dev-selected 228-row subset
    for an unconfigured model, but give no measurable gain to the already configured
    pipeline. A scorer-equivalent gold answer occurs in a 20-sample pool for 34/56
    (60.7%) rows missed by the raw fine-tune, but our selectors cannot exploit it.
    Our official prompt-only gemma-4-31B-it submission placed 6th of 17 on Track A,
    5th of 17 on Track B, and 4th of 21 on Track C. The 12B fine-tune used for analysis
    was developed first but inadvertently omitted from the blind-test submission,
    so it has no official test score.
