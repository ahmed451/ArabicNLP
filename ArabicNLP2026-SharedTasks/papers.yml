  title: 'BAREC-ST-2026: The Second Shared Task on Arabic Readability Assessment'
- abstract: 'This paper describes the system submitted by

    team HP for the BAREC Shared Task 2026

    on Arabic readability assessment. Driven by

    the Quadratic Weighted Kappa (QWK) eval-

    uation metric, which heavily penalizes dis-

    tant misclassifications, we reframe the 19-

    level task as an ordinal regression problem

    rather than standard multi-class classification.

    Our approach leverages pre-trained language

    models (AraBERTv02, ARBERT) optimized

    via Parameter-Efficient Fine-Tuning (LoRA)

    and trained with a COnsistent RAnk Log-

    its (CORAL) loss framework incorporating

    sample-level class weights. To ensure robust

    generalization, we consolidate the available

    datasets and implement a 5-fold stratified cross-

    validation pipeline. Finally, to optimize the

    QWK metric on the official blind test, we apply

    an 18-threshold Nelder-Mead optimizer cali-

    brated exclusively on blended Out-Of-Fold log-

    its, yielding a blind test QWK of 0.837. Our

    solution is released in the Github.'
