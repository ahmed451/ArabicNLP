- abstract: We describe the AKARROUCH submission to DialectSentEval 2026 Subtask 2,
    which requires reversing the sentiment of an Arabic dialect sentence while preserving
    its content. We fine-tune AraT5v2 for direction-controlled generation and use
    it to produce multiple candidates. We then rerank these candidates using CAMeLBERT
    target-sentiment probabilities and source-to-candidate chrF. The system ranked
    second in the official evaluation, achieving 78.51% sentiment accuracy, 49.82
    BLEU, and 70.12 chrF.
