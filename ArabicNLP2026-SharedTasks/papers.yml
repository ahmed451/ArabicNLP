  title: 'phonghoang at StanceEval-2026: A Two-Stage Framework for Arabic Stance Detection
    via Multi-Task Regularization and LLM-Guided Data Augmentation'
- abstract: 'Stance detection identifies an author''s position toward a specified
    target, yet Arabic social-media text remains challenging because stance is often
    implicit and shaped by dialect, sarcasm, informal expression, and culturally specific
    references. StanceEval-2026 evaluates this problem in two transfer settings: a
    related target within a seen thematic domain (Track 1) and entirely unseen topics
    (Track 2). We compare four modeling strategies: single-task Arabic encoder fine-tuning,
    multi-task learning with sentiment and sarcasm supervision, 4-bit QLoRA adaptation
    of the ALLaM-7B model, and Retrieval-Augmented In-Context Learning (RAG-ICL) with
    frozen large language models (LLMs). Our strongest single-backend configuration
    is a data-centric RAG-ICL pipeline combining label-balanced retrieval, hashtag
    and negation adaptation, text cleaning, similarity filtering, and target descriptions.
    A majority-vote ensemble of this configuration across three LLM backends obtains
    official $F_{avg2}$ scores of 0.8719 on Track 1 and 0.9016 on Track 2, ranking
    3rd and 7th, respectively. Under the shared-task test conditions, the retrieval-based
    systems substantially outperform the supervised systems evaluated here, particularly
    on Track 2.'
