  title: 'Hashtag AI at HalluScoring-2026: Distilling Knowledge-Graph Retrieval into
    Gemma 4 for Arabic Hallucination Detection'
- abstract: 'HalluScoring 2026 Subtask 2.2 (Hallucination Detection \& Find the

    Truth) requires systems to judge whether an Arabic generated answer

    is hallucinated and to select the correct one among six candidates,

    without access to the reference answer that would make both judgments

    trivial. We treat that withheld reference as privileged information:

    a teacher is fine-tuned with it in the prompt, then never deployed,

    and its advantage is transferred to a blind student through two

    channels knowledge distillation over the teacher''s output

    distribution, and a contrastive privileged-information (CPI) term

    that aligns the student''s hidden representation with the teacher''s

    gold-conditioned one. Our fine-tuned ALLaM-7B attains 84.62 combined

    score (Comb) on the official test set and 83.47 on the dev set.'
