  title: 'ImageEval 2026: Culturally Grounded Arabic Multimodal Evaluation'
- abstract: 'We describe the Dynamos submission to ImageEval 2026 Task 1b, image-grounded
    hallucination detection: given an image and three statements, exactly one of which
    is grounded, a system must label each true or false. The official ranking metric,
    Contrastive Instability (CI, lower is better), reduces exactly to one minus the
    accuracy of picking the grounded statement once a system always outputs a single
    true label, which removes an entire failure mode (marking zero or several statements
    true) at no cost. Building on this reduction, we score each statement with an
    open vision-language model and always output the highest-scoring one as true.
    Starting from zero-shot Qwen2.5-VL, we low-rank fine-tune the model with a selection
    objective, train multiple random-seed adapters, and average their scores. Our
    main finding is that the strongest single model is not the strongest ensemble
    member: a 32B adapter trained on more data performs substantially better on the
    labelled devtest split but generalises worse than smaller 7B adapters to the blind
    test set, yet combining the two model families improves over either pure-family
    ensemble on both languages, despite the 32B family generalising worse on its own.
    Our final submitted systems reach CI 0.033 in English (2nd of 8 teams on the official
    leaderboard) and 0.056 in Modern Standard Arabic (3rd of 6 teams), both well below
    our zero-shot baselines of 0.058 (English) and 0.110 (MSA).'
