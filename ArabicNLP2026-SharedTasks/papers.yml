- abstract: "This paper presents the systems we developed for ArGuard 2026 Task B,\
    \ addressing Arabic prompt safety through binary safe/unsafe classification (B1)\
    \ and fine-grained assignment of unsafe prompts to harm domains (B2). Our central\
    \ strategy is cross-lingual data augmentation: we machine-translate a large English\
    \ prompt-safety corpus into Arabic and reuse it across both subtasks. For B1 we\
    \ fine-tune the Arabic-native ALLaM-7B on self-generated rationales using the\
    \ granular labels from B2 as signal. We compare against label-only training; our\
    \ submission ranks 2nd (macro $F_1{=}0.924$). \n The experiments show the augmentation\
    \ drives accuracy and not the self-generated chain-of-thought. For B2 we fine-tune\
    \ Arabic encoders (full and adapter tuning) with a two-stage \"warm' pipeline\
    \ that first trains the encoder on the easier binary task, before specialising\
    \ it to the seven domains; our submission ranks 5th (macro $F_1{=}0.762$)"
