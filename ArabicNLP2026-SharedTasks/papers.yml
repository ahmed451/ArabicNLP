  title: 'Wifaq at NADI 2026 Shared Task: Data Expansion and System Combination for
    Robust Arabic ASR'
- abstract: 'Robust Arabic speech processing must accommodate dialectal variation,
    multilingual code-switching, and distribution shift. We present NAMAA Community''s
    systems for three NADI 2026 speech subtasks: Mixed-Dialect Arabic ASR, Code-Switched
    Arabic ASR, and 20-way Spoken Arabic Dialect Identification. For Mixed-Dialect
    ASR, an Arabic-specific Conformer--Transformer achieves 0.45 word error rate (WER)
    on the blind set, outperforming a development-selected normalization and consensus
    pipeline at 0.49. For Code-Switched ASR, two-stage LoRA adaptation of the Tunisian
    Whisper-derived FarukSTT checkpoint, with multilingual tokenization and unconstrained
    decoding, yields 20.38% WER and 8.06% character error rate (CER) on validation
    and 16.98% blind-test WER. For dialect identification, a four-model ensemble reaches
    0.950 development accuracy but 0.31 on the out-of-domain blind set. Label-free
    class-spread and inter-model agreement diagnostics identify an outlying component;
    removing it improves blind accuracy to 0.36, and a refined three-model submission
    reaches 0.38. Across Subtasks 1.2 and 2, development-selected calibration did
    not reliably transfer to blind data, although the available comparisons do not
    isolate the causal effect of individual components.'
