  title: 'YafaRE at KnowledgeGraphEval 2026: A Relation Extraction ArBERTv2-based
    Approach for Arabic Knowledge Graph Construction'
- abstract: Cross-domain Arabic Named Entity Recognition (NER) remains challenging
    because models trained on one domain can lose performance when applied to unseen
    domains with different vocabulary, writing styles, and entity distributions. This
    paper addresses this challenge, and presents Yafa's Team submission (ranked $7^{th}$)
    to Subtask 1 of the KnowledgeGraphEval 2026 Shared Task. Our system leverages
    an AraBERTv2-based model for nested Arabic NER to approach it. The proposed approach
    combines task-adaptive (TAPT) pretraining on unlabeled Konooz data, R-Drop fine-tuning
    on Wojood, strong data augmentation, teacher-student knowledge distillation, span-level
    confidence and entropy filtering, and an entity-specific confidence-aware weighted-logit
    ensemble. Three teacher models generate soft labels for Konooz, and three distilled
    student models are combined in the final ensemble to produce the final predictions.
    Wojood contains approximately 448K tokens and 72K entity mentions across 21 entity
    types, while Konooz contains data from 10 domains for cross-domain evaluation.
    The final system achieves a Micro F1 of 71.33\% on the official Konooz test set,
    improving over the non-adapted AraBERTv02 baseline of 61.00\% by 10.33 points.
    The results show that combining domain adaptation, filtered knowledge transfer,
    and entity-specific ensembling can improve cross-domain Arabic NER performance.
