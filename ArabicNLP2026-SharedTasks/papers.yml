- abstract: Speech conveys complementary information through its linguistic content
    and acoustic characteristics. Speech-related tasks can exploit either source of
    information or combine them to improve performance. In this paper, we present
    \textit{\textbf{Lynx\_Id}} and \textit{\textbf{Lynx\_In}}, our systems for the
    \textit{\textbf{NADI 2026}} Spoken Dialect Identification and Intent Recognition
    tasks, respectively. Both systems build on an automatic speech recognition (ASR)
    model. \textit{Lynx\_Id} is a late-fusion system for dialect identification. It
    combines internal representations from the ASR encoder with predictions derived
    from the ASR transcript. \textit{Lynx\_In} is a two-branch text-based system that
    uses ASR transcriptions for intent recognition. One branch predicts the intent
    among the known classes, while the second acts as a gate to detect out-of-scope
    utterances. \textit{Lynx\_Id} achieved 53.53\% accuracy and ranked third in the
    Spoken Dialect Identification task, while \textit{Lynx\_In} achieved a weighted
    F1 score of 76.86\% and ranked first in the Intent Recognition task.
