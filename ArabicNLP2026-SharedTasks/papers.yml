  title: 'Yaqeen at IslamicEval 2026: From Contextual Detection to Retrieval-Based
    Verification and Canonical Correction of LLM-Generated Arabic Islamic Citations'
- abstract: This paper presents our participation in IslamicEval 2026 Subtask 4, citation
    relevance classification for Qur'an and Hadith spans. We propose two independent
    systems for this task. The first is a generative large language model prompted
    to produce a structured, step by step relevance judgment. The second is a domain
    pretrained sentence encoder fine tuned with triplet loss on citation relevance
    data. Our evaluation compares two generative backends and three encoders pretrained
    on different Arabic varieties, using macro averaged F1 as the metric. Results
    show on development set that chain of thought judgment with ALLaM-7B consistently
    outperforms our embedding similarity ensemble, reaching 0.774 macro F1 against
    0.357 for the ensemble, and outperforms an equivalent Fanar-S-1-7B system on seven
    of eight prompting strategies. Additionally, AraBERT-v02, pretrained on Modern
    Standard Arabic, is the consistently strongest encoder, outperforming Classical
    Arabic pretrained encoders in this citation relevance task. Our best submitted
    system, ALLaM with few shot prompting without chain of thought, scores 0.748 macro
    F1 on the blind test set, narrowly ahead of the same backend with chain of thought
    added, at 0.744.
