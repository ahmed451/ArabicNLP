  title: 'ANLP-UniSo at ArGuard 2026 Task A: Multimodal AraBERT–ResNet50 with Knowledge
    Graph Fusion for Arabic Hateful Meme Detection'
- abstract: 'Detecting harmful prompts directed at large

    language models is a critical safety challenge,

    especially in Arabic where dialectal variation,

    code-switching, and culturally specific expressions

    of harm complicate classification. The

    ArGuard 2026 shared task addresses this problem

    through two subtasks: binary classification

    of prompts as safe or unsafe (B1) and

    fine-grained classification of unsafe prompts

    into seven harm domains (B2). We participate

    with a multi-task fine-tuning of MARBERT

    that shares encoder representations across a

    binary head and a seven-class granular head.

    Training combines focal loss with class weights

    and label smoothing, a hierarchical consistency

    regularizer that discourages contradictory

    safe/unsafe and granular predictions, a

    weighted sampler, and light character-level augmentation.

    On the official development set the

    system reaches a binary macro-F1 of 0.9618

    and a granular macro-F1 of 1.0000; on the blind

    test set it obtains binary macro-F1 0.688 and

    granular macro-F1 0.752. We analyse the substantial

    development–test gap and discuss limitations

    of the submitted system.'
