- abstract: Dialectal Arabic dialogue translation requires modeling both regional
    variation and conversational context under uneven supervision. We introduce LahjaMT,
    a compact system for translating English dialogue into thirteen country-level
    Arabic varieties. LahjaMT adapts the 3.12B-parameter NileChat-3B-Base model with
    LoRA, conditions translation on dialogue history and metadata, and routes each
    dialect to a checkpoint–prompt expert selected on the held-out selection set.
    The constrained system shares one backbone across all varieties; the unconstrained
    system changes only the Libyan and Sudanese routes, replacing them with specialists
    trained on auxiliary data. LahjaMT ranked second in the constrained track with
    28.30 spBLEU and third in the unconstrained track with 28.54 spBLEU.
