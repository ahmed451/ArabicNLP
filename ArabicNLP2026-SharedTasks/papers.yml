  title: 'ANLP_UniSo at KnowledgeGraphEval 2026: Domain-Adaptive Nested Named Entity
    Recognition for Arabic via GlobalPointer Ensembling'
- abstract: In this paper, we present a relation extraction system developed for Subtask
    2 of KnowledgeGraphEval 2026. The system fine-tunes a single ARBERTv2 encoder
    on inputs with typed entity markers that expose entity boundaries and types, also
    classifies each entity pair from the encoder's classification token (\texttt{[CLS]})
    state concatenated with the states at the subject and object start markers. It
    is trained over the full 41-label space, including \textit{no-relation}, with
    focal loss, class-balanced sampling, label smoothing, and \textit{no-relation}
    down-weighting to counter severe class imbalance. Our submission ranked third
    of seven teams with a micro-F1 of 0.9332, 0.23 points above the official baseline,
    which fine-tunes the same encoder. We also report an analysis of seed-dependent
    behaviour on fine-grained geopolitical relations from our earlier development
    experiments and discuss the limitations of our evaluation.
