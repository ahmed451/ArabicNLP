  title: 'NAMAA Community at NADI 2026: Mixed-Dialect and Code-Switched Arabic ASR
    and Spoken Dialect Identification'
- abstract: 'Open-set spoken intent recognition for low-resource Arabic varieties
    must handle both automatic speech recognition (ASR) errors and

    intents absent from training. We describe CIS-OpenSLU, our NADI 2026 Task 5.1
    system, which transcribes Tunisian Arabic speech with Whisper Turbo and classifies
    the resulting text using word- and character-level TF–IDF features with a LinearSVC.
    On ASR-transcribed validation audio, training the classifier on Whisper-generated
    transcripts rather than gold transcripts raises weighted F1 from 49.25% to 69.78%,
    showing that matching training and inference text distributions is crucial. We
    rank test utterances by the maximum SVM decision score and reject low-confidence
    examples as unknown; the final system achieves 71.54% weighted F1 and 72.50% accuracy,
    ranking second. Auxiliary audio and multi-modal experiments further show that
    strong unseen-intent detection in leave-one-intent-out simulation does not necessarily
    transfer to genuinely unseen test intents.'
