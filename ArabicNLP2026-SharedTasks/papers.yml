  title: 'Tarjih at StanceEval-2026: Argument-Guided Arabic Stance Detection'
- abstract: This paper presents a system for StanceEval-2026 Track 1, Arabic stance
    detection on seen targets. Systems in this track are trained on the provided targets
    and evaluated on a related target within the same thematic domain. Open large
    language models are fine-tuned with QLoRA on the original Mawqif training data
    and adapted to the test target through transductive self-training, in which unlabeled
    test tweets are added to training only when independent models agree on their
    label. The final prediction is a majority vote over three fine-tuned models, Qwen2.5-7B,
    the Arabic-native ALLaM-7B, and a sarcasm-aware variant that predicts the official
    sarcasm label before the stance label. The system scored 0.7564 Favg2 and placed
    12th of 21 teams on the official leaderboard. Across seventeen scored variants,
    task fine-tuning outperformed zero-shot prompting at every model scale, heterogeneous
    fine-tuned models converged on 98\% of test predictions, and further gains required
    decorrelated ensemble members. The sarcasm annotation supplied this decorrelation
    and improved the vote, while the sentiment annotation degraded it.
