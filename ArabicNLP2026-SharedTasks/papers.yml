  title: 'Dynamos at ArGuard Shared Tasks: Multimodal Transformers and Selective Ensembling
    for Binary and Fine-Grained Arabic Hateful Meme and Harmful Prompt Detection'
- abstract: 'This paper describes CalibGuard, our system for the ArGuard 2026 Shared
    Task on harmful content detection in Arabic memes and large language model prompts.
    We participate in all four subtasks: binary and fine-grained hateful meme classification
    (A1, A2) and binary and harm-domain prompt classification (B1, B2). For Task A,
    we extract frozen embeddings from three vision-text encoder pairs and train a
    joint two-headed classifier under 5-fold cross-validation with seed averaging.
    For Task B, we fine-tune AraBERTv02 with class-weighted cross-entropy. CalibGuard
    obtains 75.53% macro-F1 on subtask A1, 36.53% on A2, 65.38% on B1 and 68.85% on
    B2, ranking 11th, 3rd, 15th and 13th respectively. We further show that the B1
    test split contains 49.3% unsafe prompts against 79.8% in training, and that this
    distribution shift accounts for a 29-point gap between our development and test
    scores, concentrated entirely in Modern Standard Arabic. Rethresholding to the
    test prior recovers 13.7 points without retraining. We additionally report two
    negative results: constrained decoding marginally reduces A2 performance, and
    restricting B2 training to unsafe prompts costs 5.7 points.'
