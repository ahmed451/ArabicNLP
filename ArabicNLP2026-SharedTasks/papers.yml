  title: Team Falcons at ImageEval 2026 Shared Tasks:Structure-Constrained QLoRA Fine-Tuning
    and Dual-Model Consensus Verification
- abstract: 'We describe our systems for both ImageEval 2026 shared tasks. On Subtask
    1a

    (spoken visual QA) we reach 0.962 on English and 0.834 on Modern Standard

    Arabic against baselines of 0.664 and 0.398, ranking first on the English

    track and second on MSA, while on Task 2 (CRAI-Bench) our judge ensemble reaches
    a

    test Spearman of 0.673 against 0.533 for our reproduction of the organizer

    baseline. Three effects account for most of these margins: answer-token bias

    (digit labels suppress the answer 0, and ordinal words are worth 0.35 accuracy),

    Arabic speech recognition (isolated from visual reasoning by the parallel

    track design), and tie-breaking (calibration collapses ranks and a second

    judge separates them, while error correlation of 0.89 rules out cancellation).
    A

    post-submission study on degraded audio finds four transcript-level

    interventions null and measures a 9\% answer-flip rate between identical

    runs at temperature 0, a noise floor for single-run ablations.'
