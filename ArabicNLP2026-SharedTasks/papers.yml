- abstract: NADI 2026 is the seventh edition of the Nuanced Arabic Dialect Identification
    (NADI) shared task series and the second dedicated to multidialectal Arabic speech
    processing. This edition comprises five tasks and eight subtasks spanning Automatic
    Speech Recognition (ASR), Spoken Dialect Identification (SDID), Text-to-Speech
    (TTS), Spoken Language Translation (SLT), and Spoken Language Understanding (SLU).
    NADI 2026 emphasizes realistic evaluation through low-bandwidth, mixed-dialect,
    code-switched, out-of-domain, and zero-shot settings, while introducing TTS, SLT,
    and SLU to the series for the first time. The shared task attracted $21$ participating
    teams from at least $13$ countries, with $48$ test-phase submissions, and $14$
    submitted system-description papers. Results show that out-of-domain generalization
    remain a bottleneck and highlight the effectiveness of recent Arabic-specialized
    speech models, multimodal dialect identification, and ensemble methods. Overall,
    NADI 2026 provides a broader and more challenging benchmark for robust Arabic
    dialect speech processing.
