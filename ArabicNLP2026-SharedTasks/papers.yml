- abstract: We present NAMAA Community's systems for the four closed-track Arabic
    sentence-segmentation subtasks of AraSeg 2026. Heterogeneous ensembles combining
    LoRA-adapted bidirectional language models, XLM-R variants, a character-level
    SaT model, and punctuation-aware models outperform their development-selected
    single-model baselines. Large weights assigned to weaker but architecturally distinct
    members are consistent with complementary errors, although they do not establish
    causality. A training-only logistic MEMM improves F1 by $+0.9$ and $+0.6$ points
    on the punctuation-free subtasks but degrades both punctuated ones; the same directional
    pattern appears on the blind split. Aligning punctuated and punctuation-free inputs
    reveals \mbox{$+7.2/+7.1$} F1 points of oracle headroom against the contemporaneous
    NoPnx locks, while only $52.5\%$ of removed tokens are covered by the restoration
    label inventory. Genre-proxy analysis localizes the largest degradation to scriptural
    text. On the blind split, in the closed track, our systems achieved F1 scores
    of $94.4$/$91.3$/$89.9$/$87.0$ on PA, NP, NoPnx-PA, and NoPnx-NP, respectively,
    ranking $6$th/$3$rd/$4$th/$3$rd. The same systems, entered unchanged in the open
    track, rank $4$th/$2$nd/$3$rd/$3$rd. Implementation and experimental resources
    are publicly available.\footnote{\url{https://github.com/NAMAA-ORG/NAMAA-Community-AraSeg-2026}}
