  title: 'Axiom at AraSeg Shared Task 2026: A Regularized Dual-Model Ensemble with
    Domain-Adaptive Pretraining for Arabic Sentence Segmentation'
- abstract: 'We describe the iMak AI Lab submissions to the closed track of the AraSeg
    Shared Task 2026 on Arabic sentence segmentation, covering all four subtasks:
    Paragraph-Aware (PA), No-Paragraph (NP), No-Punctuation Paragraph-Aware (NOPNX-PA),
    and NoPunctuation No-Paragraph (NOPNX-NP). Our system treats segmentation as binary
    token classification with pretrained Arabic encoders finetuned only on the 128K-token
    AraSeg training split. The single-model recipe encodes documents in overlapping
    512-token windows and trains for three times more epochs than the standard schedule,
    which is the largest source of improvement in our pipeline. Per-subtask ensembles
    are then built by greedy forward selection over a pool of seven encoder families,
    several seeds, and multi-variant joint-training variants. Decoding applies deterministic
    structural constraints and a decision threshold tuned on the development set;
    no open-test labels or leaderboard feedback enter any modeling decision. The systems
    reach blind-test F1 scores of 94.1 (PA), 91.0 (NP), 89.5 (NOPNX-PA), and

    85.8 (NOPNX-NP), above the official baseline on all four subtasks. We report ablations
    for each design decision, including several that did not help.'
