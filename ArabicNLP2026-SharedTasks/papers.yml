  title: 'NYUAD at ImageEval Shared Tasks: A Multimodal LLM for Audio-Visual Question
    Answering and Hallucination Detection in English and Modern Standard Arabic'
- abstract: Visual hallucination detection in culturally grounded images has remained
    challenging due to fine-grained visual distinctions and knowledge-dependent statements.
    In the ImageEval2026 / ArabicNLP26 AynVQA Shared Task, we have participated in
    Task 1b by developing a system based on Qwen2.5-VL-7B Instruct with 4-bit quantization.
    We have reformulated hallucination detection as a single choice selection problem
    to enforce the exactly one-correct-statement constraint and have introduced confidence-based
    selective refinement using paraphrase ensemble voting. Our final system has achieved
    0.942 accuracy, 0.058 CI, 0.000 CFHR,0.942 Q+accuracy and 0.971 Q−accuracy, ranking
    6th in the English track. Error analysis has revealed that the remaining failures
    have mostly stemmed from fine-grained cultural and visual grounding challenges
    rather than prediction inconsistency.
