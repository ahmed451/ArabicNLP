- abstract: We present CUET\_InferX, our submission to Subtask~1a (Spoken VQA, English-audio)
    of the ImageEval 2026 shared task on the AynVQA dataset. The task requires predicting
    the correct answer option solely from an image and a raw audio clip containing
    both a spoken question and three candidate options. We fine-tune \texttt{Qwen2.5-Omni-3B}
    with LoRA applied exclusively to the language reasoning backbone, keeping both
    audio and vision encoders frozen, under a single 16\,GB Kaggle T4 GPU. Training
    uses a time-budgeted, class-stratified subsample of 2,055 examples. Our system
    achieves \textbf{91.20\%} test accuracy (Balanced Accuracy 87.72\%, Macro-F1 80.50\%),
    placing 3rd position, with gains of $+7.20$ accuracy and $+15.95$ Macro-F1 over
    the zero-shot base. We compare against a cascaded ASR$\to$VLM alternative and
    zero-shot 3B/7B baselines, and explain with devtest evidence why we submitted
    the end-to-end fine-tuned model despite lower raw test accuracy than the cascade.
