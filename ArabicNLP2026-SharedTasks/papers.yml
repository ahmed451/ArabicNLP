- abstract: "Detecting hateful content in Arabic memes\nis challenging due to dialectal\
    \ variation, sarcasm,\ncultural references, and the interplay between\nvisual\
    \ and textual signals. We participate\nin ArGuard 2026 Track A (Multimodal\nHateful\
    \ Meme Detection) with a multimodal\narchitecture that fuses AraBERT textual representations,\n\
    ResNet50 visual features, and a\nlightweight knowledge-graph (KG) ontology\nvector\
    \ derived from domain-specific Arabicbinary\nkeywords. The model jointly optimizes\
    \ \n(Hateful / Not Hateful) and multi-label finegrained\nclassification through\
    \ a gated fusion\nlayer with strong regularization (dropout 0.45,\nweight decay\
    \ 0.05, label smoothing 0.1). Gradual\nunfreezing of AraBERT layers, weighted\n\
    sampling, and Arabic-specific normalization\nfurther improve robustness. On the\
    \ official\ndevelopment set the system reaches a binary\nmacro-F1 of 0.710; on\
    \ the blind test set it obtains\nbinary macro-F1 0.717. We analyse the\ncontribution\
    \ of each modality and discuss remaining\nchallenges of fine-grained multi-label\n\
    prediction under severe class imbalance."
