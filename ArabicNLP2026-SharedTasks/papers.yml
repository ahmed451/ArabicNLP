  title: 'LahjaSensei at DialectSentEval 2026: Few-Shot Prompting and Model Merging
    for Sentiment Swap'
- abstract: 'This paper describes our submission to \textbf{Subtask 1 of DialectSentEval
    2026}, which focuses on three class sentiment classification for Arabic dialectal
    text. The task aims to classify sentences written in five Arabic dialects into
    \textit{positive}, \textit{negative}, or \textit{neutral} sentiment categories.
    We investigate the effectiveness of transformer-based Arabic language models through
    a series of controlled experiments. Specifically, we compare MARBERTv2 and AraBERT
    while maintaining identical pre processing, training, and evaluation settings
    to ensure a fair comparison. In addition, we examine whether explicitly providing
    dialect information as part of the input improves classification performance.


    Experimental results on an internal validation split show that MARBERTv2 consistently
    outperforms AraBERT on this task. Furthermore, removing the explicit dialect tag
    from the input slightly improves performance, suggesting that MARBERTv2 can effectively
    capture dialect-specific linguistic patterns directly from the sentence. Our best
    configuration, which uses MARBERTv2 with sentence-only input, achieves a Macro
    F1-score of \textbf{0.9394} and an accuracy of \textbf{94.24\%}. These findings
    demonstrate the effectiveness of dialect-aware pre-trained language models for
    Arabic sentiment analysis and establish a strong baseline for the official shared
    task evaluation.'
