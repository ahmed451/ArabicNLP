- abstract: This paper presents our submission to Task~1 (Argumentative Discourse
    Unit Classification, Closed Track) of the Daleel 2026 Shared Task. The task addresses
    Arabic multi-label argumentative discourse unit classification at the paragraph
    level. Our system fine-tunes CAMeLBERT-Mix using a class-weighted Binary Cross-Entropy
    loss, paragraph-type-aware input representation, head-tail tokenization for long
    paragraphs, and label-specific threshold optimization. On the official development
    set, the proposed system achieves a Macro F1-score of 0.6121, a Micro F1-score
    of 0.7509, and a Samples F1-score of 0.6387. These results suggest that a carefully
    optimized CAMeLBERT-Mix framework provides a competitive and reproducible approach
    for Arabic argumentative discourse unit classification under the Closed Track
    setting.
