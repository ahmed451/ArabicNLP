- abstract: 'Arabic knowledge graph construction is a challenging problem due to the
    linguistic complexity of Arabic and the need for robust generalization across
    domains. This paper presents our systems for the KnowledgeGraphEval 2026 shared
    task on Arabic knowledge graph construction and domain adaptation, covering two
    subtasks: AdaptNER for cross-domain named entity recognition and relation extraction
    (RE). For AdaptNER, we employ an entity-span ensemble combining two BIO sequence
    taggers with constrained conditional random field (CRF) decoding and a GlobalPointer
    span classifier. Our system achieved a micro-F1 score of 76.00\%, ranking first
    in the official evaluation. For relation extraction, we use a majority-vote ensemble
    of three LoRA-fine-tuned causal language models. This approach achieved a micro-F1
    score of 93.48\%, ranking fifth. These results demonstrate the effectiveness of
    model ensembling and complementary prediction strategies for Arabic named-entity
    recognition and relation extraction.'
