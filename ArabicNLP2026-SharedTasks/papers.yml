- abstract: 'We present the Linguistic Security Institute

    (LSI) submission to the BAREC Shared Task

    2026 (Task 1): predicting Arabic sentence readability on a 19-level ordinal scale.
    Our approach uses a logit-level ensemble of three Arabic pre-trained language
    models, with CAMeLBERT trained using an ordinal Earth Mover’s

