  title: 'AK_QMUL at ArGuard Shared Tasks: A Single Fine-Tuned JAIS for Arabic Harmful-Prompt
    Detection'
- abstract: 'The rapid growth of social media and generative AI has significantly
    increased the volume of Arabic textual content, memes, and user prompts shared
    across online platforms. While these media facilitate communication, creativity,
    and information exchange, they can

    also be exploited to disseminate hate speech, harmful content, and unsafe instructions.
    As a result, there is an increasing need for reliable

    automated methods to identify hateful Arabic memes and harmful (unsafe) prompts.
    This paper leverages pre-trained and fine-tuned multilingual embedding models
    to learn rich semantic representations from textual and visual content. The evaluation
    is conducted using a dataset of Arabic memes and prompts proposed in the ArabicNLP
    ArGuard 2026 challenge. The results underscore the capacity of

    large language model (LLM)-based embedding models to deliver superior performance.
    Developing robust detection systems is essential

    for improving content moderation and fostering a more secure and trustworthy online
    environment for Arabic-speaking users.'
