- abstract: 'We describe Ṣaqr, ranked first on both scored

    tracks of the AISA-ArabicFC shared task on

    Arabic function calling, scoring 0.9279 on

    Track A and 0.9400 on Track B over a 1,125-

    instance blind test set. The system is deliber-

    ately plain: one Qwen3-4B model with LoRA,

    two epochs, provided data only. Our contri-

    bution is not the system but an accounting of

    where score comes from. We find that scale

    helped only up to a point in our single-run,

    cross-family comparison, and that the remain-

    ing gains came instead from inference-time de-

    cisions worth +0.0063 Overall A and +0.0223

    Overall B (Appendix A) with no retraining.

    prefilling the reasoning trace so the model can-

    not skip it, and parsing arguments against the

    declared schema . We also report two proper-

    ties of the data that bound any system’s score:

    abstention is decidable from prompt structure

    without reading the query, and the gold anno-

    tation is self-inconsistent on precisely the slots

    that separate strong systems.'
