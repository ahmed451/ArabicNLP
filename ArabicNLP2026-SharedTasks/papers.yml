- abstract: 'Readability assessment has played a vital role in education, yet most
    NLP work has focused on English and a few high-resource languages, leaving fine-grained
    Arabic readability comparatively unexplored. In the BAREC Shared Task 2026, we
    have addressed sentence-level classification into 19 ordinal readability levels
    under the Strict Track, fine-tuning four Arabic transformer encoders, MARBERT,
    CAMeLBERT MSA, AraELECTRA and AraBERTv2, on the official training split under
    multiple ordinal-aware losses: soft cross-entropy, squared Earth Mover’s Distance,
    direct ordinal regression and a CORAL-style cumulative-threshold loss. A validation-only
    greedy ensemble of all resulting models, combined with a learned per-level threshold
    post-processing step, has raised performance from a best single-model QWK of 0.8341
    to a final validation QWK of 0.8507. On the official Blind Test leaderboard, our
    system has achieved a QWK of 0.848, securing 3rd place in the Strict Track'
