  title: 'DetectorAI at ArGuard Shared Tasks: Calibrated Multimodal and Label-Frequency-Aware
    Systems for Arabic Meme Safety Detection'
- abstract: We describe our system for Subtask A1 (binary hateful meme detection)
    of the ArGuard 2026 shared task (Alam et al., 2026). Our final system fine-tunes
    MARBERTv2 with class-weighted loss and macro-F1-based checkpoint selection, then
    applies a post-hoc decision-threshold calibration to correct for a class-distribution
    shift we found between the training/development splits (37.8% Hateful) and the
    held-out test split (29.6% Hateful). This calibration step requires no retraining
    and adds 3.3 macro-F1 points (0.7286 → 0.7616) on the official test split. On
    the same test split, this calibrated system also outperforms two alternatives
    we evaluated there – multi-seed ensembling and naive multimodal late-fusion. They
    match or exceed backbone-substitution and multi-model-ensemble variants that we
    were only able to evaluate on local development data. We report our full experimental
    log, including the negative results, with each result explicitly labeled by evaluation
    split, and compare our score to the AHA-Memes benchmark, where a much larger vision-language
    model reaches a similar range. Code and configuration files are released for reproducibility.
