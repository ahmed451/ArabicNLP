  title: 'Northwestern 9 at IslamicEval 2026: Fine-Grained Span Detection in Arabic
    Islamic Content Using CAMeLBERT-Mix'
- abstract: 'Large Language Models (LLMs) have significantly improved general-purpose
    question answering but remain prone to hallucinations in fact-sensitive domains
    such as religion. IslamicEval 2026  addresses these challenges by providing a
    fine-grained benchmark for evaluating hallucination and relevance in Arabic Islamic
    citations. This paper presents our approaches to three tasks: Citation Span Detection
    (Subtask 1), Hallucination Identification (Subtask 2), and Answer Relevance (Subtask
    4). For Citation Span Detection, we formulate the problem as BIO-based token classification
    and fine-tune AraBERT using overlapping sliding-window encoding to process long
    responses effectively. For Hallucination Identification, we introduce a segment-level
    verification framework that augments each citation with adaptively extracted contextual
    evidence and citation-type information. For Answer Relevance, we combine hybrid
    lexical-semantic retrieval over authenticated Qur''anic and Hadith corpora with
    Transformer-based classification, enriching retrieved evidence with citation-specific
    context such as neighboring Ayat and explicit Surah–verse references.  On the
    official test set, the proposed solutions achieved an F1 of 0.9725, an accuracy
    of 86.62%, and a macro-F1 of 0.7721 for Subtasks 1, 2, and 4, respectively, demonstrating
    the effectiveness of the proposed approaches.'
