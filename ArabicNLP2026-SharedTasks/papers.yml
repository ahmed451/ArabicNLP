  title: ALEXIS at DialectSentEval Subtask 1 Adversarial Training and Iterative Self-Training
    for Zero-Shot Dialect Sentiment Analysis
- abstract: 'Sentiment swap is the task of rewriting a sentence so that it carries
    the opposite polarity while its topic stays the same. We present a system for
    Arabic sentiment swap built on two observations about the data. First, the swap
    is a local edit rather than a paraphrase: $91%$ of reference rewrites stay within
    two words of their source. Second, the polarity to swap away from has to be predicted,
    because the test data does not provide it. We therefore fine-tune mT5 and refine
    it with Direct Preference Optimization under a reward that balances target-polarity
    probability against content preservation. At inference we pool candidates from
    four generators, one of them a minimal-edit tagger, together with a retrieval
    index, rerank them with the same balance, and repair them with polarity-flip lexicons
    mined from the training set. Source polarity is supplied by a dedicated classifier
    that reaches $97.3%$ accuracy, against $74.3%$ for the off-the-shelf sentiment
    model that the evaluation itself uses. Every component was scored on the official
    leaderboard: generation-side work contributes $+0.044$ Sentiment Style Accuracy,
    and the dedicated polarity classifier a further $+0.155$. The final system reaches
    $0.9581$ Sentiment Style Accuracy, $56.91$ BLEU and $72.18$ chrF, ranking 1st
    of 15 submissions.'
