  title: 'AhmedNLP at IslamicEval 2026: Learning Answer Relevance from Within-Response
    Citation Preferences'
- abstract: 'Large language models are increasingly used to answer questions about
    religious texts, yet their fluent responses may contain misquoted, misattributed,
    or fabricated citations. Detecting such hallucinations requires identifying citation
    components, verifying their correctness, and recovering the canonical text when
    a quotation is incorrect. We present Yaqeen''s submission to the IslamicEval 2026
    shared task, which evaluates these capabilities through three subtasks: detection
    of Qur''anic verses, Hadith text, chains of narration, and claimed sources; identification
    of incorrect citation fragments; and correction of erroneous Qur''anic and Hadith
    quotations. We develop task-specific systems combining AraBERT-based character-level
    sequence labeling with retrieval-based matching, classification, and reranking.
    Our systems achieve 96.78\% character-level Macro-F1 on Task 1, 91.07\% accuracy
    on Task 2, and 78.02\% accuracy on Task 3. The results show that combining contextual
    Arabic representations with retrieval-based evidence is effective for fine-grained
    hallucination detection and correction in Arabic Islamic content.'
