  title: 'Digilians at ImageEval 2026 Shared Tasks: Modular Speech Parsing and  Joint
    Multimodal Reasoning for Arabic Spoken VQA'
- abstract: 'Dialectal Arabic machine translation (MT) remains challenging despite
    recent progress in Arabic language technologies, particularly because effective
    translation requires modeling not only semantic content but also dialectal variation,
    conversational context, speaker and addressee characteristics, and sociolinguistic
    appropriateness. Moreover, conventional MT metrics provide limited insight into
    the linguistic errors produced by dialectal systems. We present the AlexandriaX
    2026 Shared Task on Dialectal Arabic MT, which addresses these challenges through
    three complementary subtasks: (1) context-aware English-to-Dialectal Arabic dialogue
    translation across 13 Arabic varieties, (2) cross-dialect Arabic translation in
    the financial domain covering six Arabic dialects, and (3) span-level MT error
    detection and classification using linguistically motivated error categories across
    five Arabic varieties. The shared task attracted 38 registrations for Subtask
    1, 33 for Subtask 2, and 35 for Subtask 3. Twelve unique teams submitted their
    system description papers, all of which we accepted for publication. The best
    system on Subtask 1 achieved 30.42 spBLEU in the constrained track and 33.49 spBLEU
    in the unconstrained track. On Subtask 2, the top system obtained 28.40 spBLEU.
    On Subtask 3, the best system achieved an overall score of 49.82, outperforming
    the 24.29 baseline. Taken together, the results of the leading systems across
    the three subtasks highlight the benefits of explicit dialect modeling, context-aware
    generation, retrieval and reranking, and specialized approaches to interpretable
    MT error analysis. All the resources of AlexandriaX 2026 shared task are publicly
    available, including data, baselines, and evaluation code on our project page:
    https://alexandriax.dlnlp.ai.'
