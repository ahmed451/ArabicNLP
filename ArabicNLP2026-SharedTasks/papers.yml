- abstract: 'This paper presents Daleel 2026, the first shared task on argument mining
    in Arabic news editorials and competitive debates. Daleel includes two tasks:
    Task 1 identifies which of six argumentative discourse unit (ADU) categories are
    present in a paragraph, while Task 2 locates the units with their labels and exact
    text spans. The tasks are performed using a new corpus of 30 documents, 1,042
    paragraphs, and about 76k words. Twenty-nine teams registered, 12 participated,
    and 10 submitted system papers. Both tasks have Closed and Open tracks. The best
    results for the Closed track were 0.7117 macro-F1 in Task 1 and 0.7547 modified
    overlap F1 in Task 2. The results show different insights: the best Closed-track
    score of each team was higher on debates than on editorials. A broad range of
    approaches was used in Task 1 submissions, including Arabic encoders, large language
    models, rules, and ensembles. Task 2 systems, in particular the top-ranked ones,
    were more similar and mainly used CRF or Viterbi decoding with combinations of
    models or training runs. The rare ADU categories remained difficult in both tasks,
    and identifying exact span boundaries was an additional challenge in Task 2.'
