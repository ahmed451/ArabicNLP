  title: 'SanadAI at IslamicEval 2026: Detecting Hallucinations in Arabic Islamic
    Citations through Span Detection and Hybrid Verification'
- abstract: 'Islamic question-answering systems can produce fluent Arabic while altering
    Qur’anic wording, Hadith text, narrator chains, or source

    attribution. We present Tathabbut for two IslamicEval 2026 settings: fine-grained
    verification and canonical correction. For verification, Canonical-Provenance
    Evidence Fusion (CPEF) classifies Ayah, matn, isnad, and claimed-source segments
    by combining canonical retrieval with collection, narrator, response-level, contradiction,
    and exact-matn provenance evidence. CPEF achieves 0.9452 macro accuracy on the
    official Test set. For correction, Type-Aware Selective Canonical Retrieval (TASCR)
    reranks authoritative Qur’anic and Hadith candidates using lexical, memory-based,
    contextual, and source evidence, and abstains when confidence is insufficient.
    TASCR achieves 86.29% Test accuracy. A post-hoc Development diagnostic finds the
    gold correction for 319/327 (97.55%) recoverable cases in an expanded candidate
    pool, indicating that candidate discrimination and abstention are larger bottlenecks
    than retrieval recall. Neither submitted component invokes a generative LLM at
    inference time.'
