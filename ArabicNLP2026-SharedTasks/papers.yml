  title: 'Saudi Legal FC at AISA-ArabicFC: Disciplined Fine-Tuning and Gold-Free Post-Processing
    for Arabic Function Calling'
- abstract: We describe the Durham-Jazan submission to AISA-ArabicFC 2026, an Arabic
    function-calling task in which a system selects one tool from four candidates
    and fills its arguments, scored on tool choice (FnAcc) and on strict exact match
    of the whole argument dictionary (ArgEM). Across six QLoRA fine-tunes of ALLaM-7B
    and Qwen2.5-7B, trained on the provided data, negatives derived from it and 68
    hand-written no-tool utterances, and run on one 16 GB GPU, we vote on each argument
    separately, then apply two deterministic rules estimated from training statistics.
    The system reaches ArgEM 0.824 on development under the final evaluator and 0.826
    on the blind test, placing 9th of 17 in Track A, 8th of 17 in Track B and 11th
    of 21 in Track C. Our main findings concern the benchmark. The reference tool
    is listed first on every training and development row that calls one, in every
    data release. Shuffling the candidates at inference costs the voted system 0.202
    FnAcc and 0.190 ArgEM, and retraining one adapter per base on permuted candidates
    removes the dependence with no loss of ArgEM. One post-processing rule contributes
    0.028 ArgEM and is the only component whose gain separates from zero, the other
    targets a convention the final data release removed and is inert, and the largest
    effect we can measure comes from the benchmark's construction rather than from
    our modelling.
