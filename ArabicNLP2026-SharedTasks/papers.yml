- abstract: We present our approach in this submission for ArGuard 2026 Subtask B1,
    which classifies Arabic prompts directed at large language models as Safe or Unsafe.
    Our system combines four sparse TF-IDF feature representations with dialect indicators
    and surface-level features. We trained logistic regression and Naive-Bayes SVM
    (NBSVM) classifiers and combined their predictions using late fusion. The system
    achieved a Macro-F1 score of 0.94 and an accuracy of 0.96 on the development set.
    On the test set, our submission achieved 0.79 accuracy, 0.85 macro precision,
    0.71 macro recall, and 0.72 Macro-F1.
