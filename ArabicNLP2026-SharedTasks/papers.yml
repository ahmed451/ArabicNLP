- abstract: This paper presents the SRK AI Lab system for Arabic stance detection
    in the StanceEval 2026 shared task using the Mawqif-XT benchmark. We employ a
    few-shot multi-LLM framework with GPT-5.5 Instant, Gemini 3.6 Flash with Extended
    Thinking, and Qwen 3.7 Plus to classify target–post pairs as Favor, Against, or
    None. The models independently predict stance, followed by GPT-5.5 Instant auditing
    based on target–post relation, linguistic context, and stance evidence. The audit
    results are combined with cross-model comparison to select the final label. Our
    system achieves an official Favg2 of 0.8420 in Track 1 and 0.9192 in Track 2,
    ranking 8th and 3rd, respectively. These results demonstrate the performance of
    multi-LLM few-shot prompting with GPT-5.5 auditing for Arabic stance detection.
