- abstract: This paper describes the Rosetta system for Subtask 1 (Context-Aware English-to-Dialectal
    Arabic Dialogue Translation) of the AlexandriaX shared task, participating in
    both constrained and unconstrained tracks. The approach fine-tunes a LoRA adapter
    on NileChat-3B using structured system/user prompts that condition generation
    on dialect and dialogue context. For the unconstrained track, the adapter is additionally
    pretrained on MADAR and PADIC. Rosetta ranked 4th in the constrained track (spBLEU
    26.10) and 5th in the unconstrained track (spBLEU 25.09). The experimental results
    demonstrate that external pretraining helps only two of thirteen dialects while
    slightly hurting overall performance, suggesting negative transfer.
